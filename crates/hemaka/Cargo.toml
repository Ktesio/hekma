[package]
# Hemaka (a Ktesio project) — v0.8.0 rename of the `ktesio` crate (frozen
# at 0.7.0 on crates.io; preserved, never yanked). The package ships TWO
# binaries: `hemaka` (primary) and `maka` (short alias) — both standalone
# entry points to the same CLI implementation.
name = "hemaka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Run AI agents like services: supervise their lifecycle, meter real token usage, and enforce dollar budgets."
license-file.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["agent", "ai", "supervisor", "metering", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hemaka"
path = "src/main.rs"

[[bin]]
name = "maka"
path = "src/bin/maka.rs"

[dependencies]
hemaka-engine = { workspace = true }
clap = { workspace = true }
console = { workspace = true }
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }
semver = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Test-only: seed a `running` instance directly into the engine's SQLite state
# so the `kt agent remove` running-guard (AC5) can be exercised end-to-end.
# Dev-only — excluded from the boundary gate (`cargo tree -e normal,build`), so
# the shipping `kt` crate still never depends on SQLite.
rusqlite = { workspace = true }
# Test-only (story 1-6): the `fake_agent` helper binary, so a CLI test can point
# a manifest adapter's launch exec at a real spawnable process and prove
# `kt agent start` restarts a `failed` instance to `running`. Dev-only — excluded
# from the boundary gate (`cargo tree -e normal,build`), so the shipping `kt`
# graph still never depends on it (same rationale as the engine's dev-dep).
hemaka-conformance = { path = "../hemaka-conformance" }

[lints]
workspace = true
