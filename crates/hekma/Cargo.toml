[package]
# Hekma (a Ktesio project) — v0.8.0 rename of the `ktesio` crate (frozen
# at 0.7.0 on crates.io; preserved, never yanked). The package ships TWO
# binaries: `hekma` (primary) and `hkm` (short alias) — both standalone
# entry points to the same CLI implementation.
name = "hekma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The control plane for agent workloads: run, see and steer AI agents. Supervises their lifecycle, meters real token usage and enforces budgets."
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["agent", "ai", "supervisor", "metering", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hekma"
path = "src/main.rs"

[[bin]]
name = "hkm"
path = "src/bin/hkm.rs"

[dependencies]
hekma-engine = { workspace = true }
# Story 17-2 (AD-2 amendment): the long-running Service Host — the `serve`
# subcommand's engine. The ONLY new normal edge (`cargo tree -p hekma -e
# normal` gains exactly `hekma-host` + its engine/tokio subtree, no axum);
# the CLI source stays synchronous (the embed-clean audit pins that).
hekma-host = { workspace = true }
clap = { workspace = true }
console = { workspace = true }
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }
semver = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Test-only: seed a `running` instance directly into the engine's SQLite state
# so the `kt agent remove` running-guard (AC5) can be exercised end-to-end.
# Dev-only — excluded from the boundary gate (`cargo tree -e normal,build`), so
# the shipping `kt` crate still never depends on SQLite.
rusqlite = { workspace = true }
# Test-only (story 1-6): the `fake_agent` helper binary, so a CLI test can point
# a manifest adapter's launch exec at a real spawnable process and prove
# `kt agent start` restarts a `failed` instance to `running`. Dev-only — excluded
# from the boundary gate (`cargo tree -e normal,build`), so the shipping `kt`
# graph still never depends on it (same rationale as the engine's dev-dep).
hekma-conformance = { path = "../hekma-conformance" }

[lints]
workspace = true
