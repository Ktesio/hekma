[package]
name = "hekma-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Hekma long-running Service Host; drives the engine as a supervised, signal-aware service"
license.workspace = true
homepage.workspace = true
repository.workspace = true
# UNPUBLISHED by decision (17-2): publication (and any version alignment with
# the workspace release train) is the container/release story's step (17-5 /
# docs/release-process.md), never an autonomous flip.
publish = false

[dependencies]
# The ONLY internal edge (AD-2 amendment 2026-10-19): the host drives the
# engine's PUBLIC API (Engine / EngineOptions / DiagnosticSink / domain types
# / the paths authority). Verify with `cargo tree -p hekma-host -e normal`.
hekma-engine = { workspace = true }
# The host owns ONE tokio Runtime of its own (the `Engine`'s
# internal-runtime shape — the host lib stays a sync, blocking call surface):
# the shutdown-signal wait and the engine's async drain calls run on it. The
# workspace's shared feature set covers the runtime; the host-only additive
# features are `signal` (the OS shutdown streams) and `sync` (the `watch`
# channel that holds an early signal across the engine open — the review
# finding 1 fix) + `time` (the arming-handshake timeout).
tokio = { workspace = true, features = ["signal", "sync", "time"] }
# The Control API's HTTP stack (story 17-3; D2 ratified axum 0.8, NFR-8
# review in `_bmad-output/planning-artifacts/host-mode-decisions-2026-10-19.md`):
# `default-features = false` + the LEAN feature set the v0 route table needs —
# `http1` (a local loopback bind, HTTP/1.1 only), `json` (Json extractors),
# `tokio` (the serve glue on the host's runtime), `query` (the resync cursor
# pull). Everything else the defaults would drag in (`form`, `matched-path`,
# `original-uri`, `tower-log`, `tracing`) stays OUT. NOTE: the spec's feature
# list also named `sse`; axum 0.8 has NO such feature — SSE support moved into
# the unconditionally-compiled response types in 0.7 (`axum::response::sse`
# carries no `#[cfg(feature)]` gate in the 0.8.9 source), so the live-events
# route needs no flag and the listed `["http1","json","tokio","sse","query"]`
# resolves with `sse` dropped — recorded in the story report. The tree diff is
# recorded in the story's PR (the D2 erratum: the diff records where axum
# ENTERS — 17-3, not 17-2); hyper-direct remains the honest fallback if a
# future review shows the tower family growing beyond the ratified estimate.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
# The DTOs (`serde` derive on the host's own wire shapes) and the JSON
# encoder/decoder every handler body uses — the SAME workspace pins the
# engine's payload structs already carry; the host defines its OWN shape
# types (AD-2 amendment) and serializes the engine's versioned payloads
# verbatim through them.
serde = { workspace = true }
serde_json = { workspace = true }
# The SSE stream's `unfold` combinator (the per-client receiver → frame
# loop). ALREADY in the normal tree as axum's own dependency — declaring it
# here adds NO new package to `cargo tree -p hekma-host -e normal`; it only
# names what we compile against directly.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# The OTLP exporter's POST client (AD-21): the workspace's hyper family,
# ALL already in this crate's normal closure via axum + hekma-engine's
# metering listener — declaring them adds NO new package to
# `cargo tree -p hekma-host -e normal`; it only names what the exporter
# compiles against directly (the plain-HTTP POST, the bounded timeout, the
# body type). NO TLS stack here: v1 is http-only by decision.
hyper = { workspace = true }
hyper-util = { workspace = true }
# `http` has no workspace pin (nothing compiled against it directly before);
# it is ALREADY in the normal tree (hyper's own dependency) — same 1.x pin.
http = "1"
http-body-util = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
# Hermetic per-test state roots.
tempfile = { workspace = true }
# The integration tests drive the async `drain_and_stop`/`serve_with_signal`
# seam directly; tokio here is the SAME workspace pin (dev-only — the normal
# tree is unchanged, `cargo tree -p hekma-host -e normal` stays engine+tokio).
tokio = { workspace = true }
# The `fake_agent` fixture (the same dev/test kit the engine's own
# subprocess tests use — off every shipping graph).
hekma-conformance = { path = "../hekma-conformance" }
# The conformance suite drives the API over REAL HTTP with a sync client
# (plain `#[test]` fns, like the rest of the crate's suite). The SAME
# workspace pin `kt` already ships; dev-only, off every shipping graph.
ureq = { workspace = true }

[[bin]]
name = "hekma-host"
path = "src/main.rs"

[lints]
workspace = true
