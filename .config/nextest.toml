# cargo-nextest configuration for the `test` CI job (#106).
#
# WHY nextest here (test-harness, not product): the `test` job runs the
# process-spawning engine integration suite on a 3-OS matrix. Two chronic
# GitHub-runner problems motivated the switch off plain `cargo test`:
#   1. ubuntu-latest (a genuine 2-core runner) could exhaust the job-level
#      timeout with NO per-test signal — `cargo test` gives no way to time-box
#      or name an individual slow/hung test, so a single stuck test silently
#      burned the whole budget and GitHub discarded the cancelled job's logs.
#   2. windows-latest intermittently missed a per-test wall-clock deadline on
#      the slow runner (a different engine test each run) — a pure timing flake
#      that passed on re-run.
#
# nextest fixes both: `slow-timeout` time-boxes and NAMES a stuck test (it
# becomes a normal, logged failure instead of a job-level hang), and `retries`
# absorbs the Windows timing flake. Product code is untouched.

[profile.default]
# Retry a failed test up to twice (3 attempts total). A test only counts as
# failed if EVERY attempt fails, so a flake that passes on re-run is absorbed.
# This directly covers the windows-latest timing flake (an engine test that
# occasionally misses its own ~30s convergence deadline on the slow runner and
# fails an assert, then passes immediately on retry). Deterministic failures
# still fail — a real bug fails all 3 attempts.
retries = 2

# Time-box each individual test. `period = "60s"` marks a test as SLOW after 60s
# (logged, NOT killed — generous headroom over the suite's internal ~30s
# convergence deadlines plus process spawn/stop overhead on a slow runner).
# `terminate-after = 4` KILLS the test after 4 such periods (4 x 60s = 240s) and
# reports it as a timeout FAILURE. This converts a hung test — which under plain
# `cargo test` ran until the 25-min job cancel with no logs — into a NAMED
# failure at ~4 min, so the job never silently hangs and the culprit is visible.
slow-timeout = { period = "60s", terminate-after = 4 }

# Show output for failed (and retried) tests so a flake or a timeout kill lands
# in the CI log with its captured stdout/stderr, not a bare status line.
failure-output = "immediate-final"
# Level "leak" (⊇ slow ⊇ retry ⊇ fail): SLOW markers print live at each
# slow-timeout period and LEAKED notices print for output-fd-holding
# survivors (2026-10-17 wedge forensics): during the x86-ubuntu wedge family
# NO test was ever named before the 40m job cancel — with slow markers
# streaming live, the surviving log's tail names the tests that were in
# flight when the lane wedged, and leak notices make fd-holding leftovers
# explicit instead of silent. Display-only; no kill/retry semantics change.
status-level = "leak"

# Serialize the HEAVY hekma-engine integration tests (#106). The `adoption` binary
# (and its siblings) RE-EXEC the test binary as subprocesses that spawn real
# `fake_agent` children with `--linger-ms 600000`, deliberately designed to SURVIVE
# and re-parent to init (the NFR-1 engine-crash survival proof). Under nextest's
# intra-binary parallelism on the genuine 2-core x86 ubuntu runner, many heavy
# re-exec'd processes plus long-lived orphans ran at once and the runner wedged into
# an UNINTERRUPTIBLE (D-state) hang that rode the job to its timeout-cancel. A
# per-binary bisect on CI pinned the culprit to `hekma-engine::adoption`; it passes
# on macOS, Windows, and arm64-2core — this is x86-ubuntu-runner-specific under
# concurrent heavy process-spawning. Capping this test-group to ONE thread removes
# the contention. It HIDES/SKIPS nothing — every test still runs and full coverage
# is retained; it only limits PARALLELISM (harmless on fast runners, a small
# wall-clock cost). The `filter` selects exactly the 10 engine integration binaries
# (kind(test) & package(hekma-engine)) — NOT the engine lib unit tests (kind=lib),
# NOT other crates.
[test-groups.engine-integration-serial]
max-threads = 1

[[profile.default.overrides]]
filter = "kind(test) & package(hekma-engine)"
test-group = "engine-integration-serial"

# Serialize the CLI crate's integration binary too (the 2026-10-17 x86-ubuntu
# wedge). The #106 group above covers the engine binaries, but the CLI
# integration binary (crates/hekma/tests/agent_cli.rs) grew its own
# process-spawning population outside it: #281's surviving-engine supervision
# legs and the raw-follow rewrite hold LIVE detached fake_agent children
# (--linger-ms 600000) plus follow/stop engine processes DURING the test, on a
# lane that also runs the serialized engine group — the same concurrent
# heavy-re-exec + long-lived-orphan population that wedged the 2-core runner
# into an uninterruptible D-state hang in #106. Symptom here: the ubuntu-latest
# test job cancelled by its own 40m job timeout three-for-three on PR trees
# carrying those tests (PR #284, 2026-10-17) while macOS/Windows stayed green
# and the same tests passed on a quiet many-core box in seconds — a
# runner-contention wedge, not a test-logic hang (nextest's slow-timeout kill
# would have named a stuck test long before 40m). Same remedy as #106, same
# group so the engine and CLI process-spawners never overlap: the whole
# agent_cli binary runs max-threads=1. Cost is negligible — the binary is 129
# tests, 25s fully single-threaded on a dev box. This HIDES/SKIPS nothing;
# it only limits parallelism.
[[profile.default.overrides]]
filter = "kind(test) & package(hekma)"
test-group = "engine-integration-serial"

# Serialize the engine crate's LIB unit tests too (the 2026-10-17 wedge,
# probe 2). The two overrides above cover `kind(test)` — the integration
# binaries — but #281 also grew process-spawning at kind(lib):
# src/domain/supervisor/tests.rs's release-pass legs (resume/freeze/
# reconcile of DETACHED children — SIGSTOP/SIGCONT on live fake_agents)
# run as plain lib unit tests, fully parallel on the genuine 2-core x86
# ubuntu runner. With both integration surfaces serialized but the lib
# spawns parallel, the lane still wedged into the #106 D-state family:
# every ubuntu-latest test run since 2026-10-16T23:42Z on a #281-carrying
# tree died at its 40m job timeout (7 verified by the timeout annotation
# or an exact-45m cancel, the agent_cli serialization active for the
# last; macOS/Windows green throughout; every serialized binary passes
# under nextest on a dev box in seconds). Joining the lib tests to the
# same group closes the last unsynchronized process-spawning surface —
# all engine/CLI spawners now mutually exclude. HIDES/SKIPS nothing;
# only parallelism changes. The lib suite is unit-level and fast.
[[profile.default.overrides]]
filter = "kind(lib) & package(hekma-engine)"
test-group = "engine-integration-serial"

# Unbounded test-group, referenced ONLY by the `parallel-heavy` profile below.
# A profile override must assign a test-group; max-threads at i32::MAX turns
# the group into a no-op throttle that restores nextest's default UNLIMITED
# concurrency for the tests routed to it.
[test-groups.unbounded]
max-threads = 2147483647

# `parallel-heavy` — the windows-latest CI leg's profile (adopted
# 2026-10-27): the SAME suite, the SAME retries / slow-timeout /
# failure-output / status-level (all inherited from `default` through the
# profile chain) — but with the three serialization overrides above SHADOWED
# so the engine/CLI/lib spawners run at nextest's default parallelism.
# Measured on the full matrix: `default` serialized the windows test step
# to 40m02s (51m51s job, run 40383210835) — past the 50m job budget on
# main (runs 40355871363 and 40337860524 both cancelled at the windows
# timeout); `parallel-heavy` runs the same suite in 12m15s (24m01s job,
# run 40459586527) — 3.3x on the step, 2x headroom back under the budget.
#
# Why shadowing rather than an empty profile: nextest consults `default`'s
# [[overrides]] for EVERY custom profile through the inheritance chain
# (verified empirically on cargo-nextest 0.9.148: an empty custom profile
# serializes exactly like `default`), and the selected profile's own
# overrides are consulted FIRST — so a same-filter override assigning an
# unbounded group is the one mechanism that restores parallelism.
#
# Scope: runners where the #106/#281 x86-ubuntu 2-core D-state wedge NEVER
# occurred (this file's own record: adoption "passes on macOS, Windows, and
# arm64-2core"). The ubuntu leg keeps the serialized `default` profile; the
# CI matrix selects this profile per-OS via matrix data.
[profile.parallel-heavy]
[[profile.parallel-heavy.overrides]]
filter = "kind(test) & package(hekma-engine)"
test-group = "unbounded"

[[profile.parallel-heavy.overrides]]
filter = "kind(test) & package(hekma)"
test-group = "unbounded"

[[profile.parallel-heavy.overrides]]
filter = "kind(lib) & package(hekma-engine)"
test-group = "unbounded"
