  # From story 1-6 code review (2026-07-04, verdict APPROVED WITH NITS — 6 in-scope fixes applied in-story; these 5 deferred as out-of-1-6-scope follow-ups, reviewer-agreed)
  - id: AI-10
    epic: 1
    owner:
    status: done  # DONE in 721c6d9 (2026-07-06): start_time stored on UnixProcess, re-verified each adopted poll — mismatch→Exited (recycled-PID crash caught), read-failure→Alive+retry (review hardening, no false-fail of a live agent), PID-gone→Exited. Windows already immune. Review Approved-with-nits; 687 tests, 95.17%.
    severity: high
    action: "ktesio-engine backends/unix: an ADOPTED UnixProcess (child: None) checks
      liveness via kill(pid,0) and verifies the start-time fingerprint ONLY at adoption
      time, never on subsequent reaper polls. If an adopted agent crashes and the
      OS recycles its PID within a reaper interval (~250ms), poll_once reads the recycled
      PID as Alive → the crash is never detected, the row stays a phantom `running`,
      no restart fires. Windows is safe (self.adopted is a real HANDLE, immune to
      PID reuse) — a Unix/Windows asymmetry. Fix: store start_time on UnixProcess
      and re-verify process_start_time(pid) in the adopted branch of reap_if_exited
      (or adopt via pidfd). Needs a follow-up story (touches the hot poll path). Reduced-surface
      by AI-8/F-Low-2 (terminal records settle to pid-0 seed, skipped by adopt)."
  - id: AI-11
    epic: 1
    owner:
    status: done  # DONE in 721c6d9 (2026-07-06): Engine::remove stops/tears down a live/adopted instance (kills group, drops handle, clears write-ahead record) before deleting the row — plain + --force; teardown-failure aborts the remove (no orphan); Paused-live handled; lock order registry→supervisor consistent (no deadlock). Review verified.
    severity: medium
    action: "ktesio-engine Engine::remove / registry.remove: `kt agent remove` (incl.
      --force) deletes the instance row (FK-cascading the agent_runtime write-ahead
      record) but never stops or drops the Supervisor.running handle of a live/adopted
      instance — the process survives until Engine::drop, and because its write-ahead
      record is now gone, a subsequent engine crash leaves a TRUE unsupervised orphan
      no future engine can adopt (NFR-1 counterexample). Pre-existing gap (remove
      never stopped processes; deferred from 1-2/1-4). Fix: remove should stop the
      live process / drop the handle before deleting the row. Needs a follow-up story
      + a product decision on remove-of-a-running-instance semantics."
  - id: AI-12
    epic: 1
    owner:
    status: open
    severity: low
    action: "ktesio-engine supervisor.rs poll_once: a persistent backend.poll error
      is swallowed as `Err(_) => None` (treat as alive), so a permanently un-pollable
      handle is never crash-detected and stays `running` forever with no diagnostic.
      Fix: count consecutive poll errors and surface/reconcile past a threshold."
  - id: AI-13
    epic: 1
