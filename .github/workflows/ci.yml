name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    # AI-37/AI-54 (story 11-5): the FULL CI — the 3-OS test matrix and the
    # coverage job included — runs on EVERY branch push, not only main and not
    # only PRs. The old main-only push filter meant a feature branch's
    # commits got local-OS-only verification until the PR was opened (Epic 2's
    # lesson: cross-OS + coverage surprises surfaced under merge pressure);
    # this glob keeps the existing push-to-main runs AND runs the same job set
    # on every feature-branch push (the Epic-9 precedent, now codified).
    # Repeated pushes to the same branch collapse into one run via the
    # concurrency group below (cancel-in-progress).
    branches:
      - "**"
  schedule:
    # Nightly full CI on the default branch (GitHub runs `schedule` there):
    # an always-fresh cross-OS + coverage record even when nothing pushed.
    # 07:17 UTC — off the top of the hour where scheduled jobs queue longest.
    - cron: "17 7 * * *"
  # Manual dispatch (the AI-37 "or nightly/manual on feat/* branches" shape):
  # run the full job set on any ref on demand from the Actions tab / `gh
  # workflow run`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        # Explicit +stable: the root rust-toolchain.toml pins bare `cargo` to the
        # MSRV (1.96.1); this job intentionally exercises latest stable, and a
        # +toolchain argument overrides the toolchain file. The dedicated `msrv`
        # job proves the 1.96.1 floor.
        run: cargo +stable fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Run clippy
        # Explicit +stable (see fmt job): pin covers local bare cargo; CI stays
        # on latest stable here, MSRV floor proven by the `msrv` job.
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    # 3-OS matrix (spine AD-4, NFR-2): the per-OS ProcessBackend supervision code
    # (Unix process groups / Windows Job Objects) is UNVERIFIABLE on a single OS —
    # cfg(windows) code does not even compile on Linux, so the Windows Job-Object
    # backend's behavior is proven ONLY by the windows-latest runner here. Linux +
    # macOS prove the Unix backend on both Unixes. Coverage (tarpaulin, Linux-only)
    # measures the OS-agnostic core + the Unix backend; the Windows backend's
    # correctness rides on this matrix, its lines cfg-excluded from the Linux
    # coverage denominator (see docs/testing.md — coverage-honesty reconciliation).
    strategy:
      fail-fast: false
      matrix:
        # Linux leg PINNED to ubuntu-26.04 (class-2 runner-freeze mitigation,
        # tracking #292): the wedging image is 24.04 (kernel 6.17.0-1022-azure);
        # 26.04 is GA and is where ubuntu-latest migrates anyway Oct 19–Nov 19
        # 2026 (actions/runner-images#14748). Unify back post-migration.
        os: [ubuntu-26.04, macos-latest, windows-latest]
        # Wedge forensics (2026-10-17): the ubuntu leg's test RUN is wall-clock
        # capped and session-quarantined, and its JOB timeout tightened to 15m —
        # see the "Run tests (nextest)" step below for the full why (two wedge
        # classes; the freeze class is environment-bounded via the 26.04 pin).
        # Carried as matrix DATA (not an in-step OS comparison) so the run step
        # stays one uniform invocation for all three OSes.
        # nextest profile per leg (2026-10-27): the windows-latest leg runs
        # the suite through the `parallel-heavy` profile (.config/
        # nextest.toml) — same retries/timeouts, serialization overrides
        # shadowed. The serialization guards against the #106/#281
        # x86-ubuntu 2-core D-state wedge, which never occurred on
        # windows/macos (parallelism was proven green there pre-#106) — and
        # serialized windows had outgrown the 50m job budget (test step
        # 40m02s / job 51m51s on #347's green run; main runs 40355871363
        # and 40337860524 cancelled at the windows timeout). Un-serialized:
        # 12m15s step / 24m01s job (run 40459586527). The other legs keep
        # `default` (explicit `--profile default` is valid and
        # behavior-identical to the bare invocation). Carried as matrix
        # DATA so the run step stays one uniform invocation.
        include:
          - os: ubuntu-26.04
            nextest_wallclock_cap: 30m
            test_job_timeout_minutes: 15
            nextest_profile: default
          - os: macos-latest
            nextest_profile: default
          - os: windows-latest
            nextest_profile: parallel-heavy
    runs-on: ${{ matrix.os }}
    # ubuntu is a genuine 2-core runner and Windows' bundled-SQLite/tokio first
    # build is slow; this job builds test binaries, runs the suite, and runs the
    # doctest pass. 25 was calibrated when the suite fit (the heavy hekma-engine
    # integration tests are SERIALIZED — the `engine-integration-serial`
    # max-threads=1 test-group in .config/nextest.toml, the #106 x86-ubuntu
    # `adoption` hang fix); the suite has since GROWN past 1,295 nextest tests
    # (epics 12-14), and the windows-latest leg now rides the 25-minute wall
    # under runner contention — GitHub marks a job timeout as CANCELLED, so
    # three consecutive runs died silently at ~25m05s (2026-09-22/23, the
    # #235 window; bisect: identical Rust content green at the #193 merge
    # run). 40 restored that headroom then; the suite has since grown past
    # 1,671 nextest tests (epics 15-17) and the windows-latest leg rides
    # 33-38m GREEN (37m26s on the epic-17 tree, run 39445820001), so a
    # cold-cache leg has no budget left: run 39472620931 (post-epic-17
    # main) missed BOTH windows caches (cargo registry keyed by the new
    # Cargo.lock + the evicted Windows-cargo-nextest-bin, which recompiled
    # nextest from source for ~5.5m), spent 9m00s before the suite even
    # started, and the 40m job timeout killed the suite mid-run (GitHub
    # marks it CANCELLED, fail-fast then took the queued macos leg with
    # it) — 50 restores cold-cache headroom. nextest's per-test kill-timeout (see
    # .config/nextest.toml) remains the cross-OS per-test hang guard; the
    # residual Windows slow-runner flake family (TCK observed-section 30s
    # contention timeouts + a still-unidentified silent stall) is chartered
    # under epic-12 retro item 95 (see #236). The matrix `include` tightens
    # the PINNED ubuntu-26.04 leg to 15m (tracking #292): the healthy lane is
    # ~4.5m, so 15m keeps cold-cache headroom while a class-2 freeze costs the
    # 15+5m service window instead of 45m and surfaces as a fast visible
    # cancel rather than a silent three-quarter-hour burn.
    timeout-minutes: ${{ matrix.test_job_timeout_minutes || 50 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # runner.os keys the cache per-OS so the three matrix legs never collide.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install cargo-nextest
        # Pinned prebuilt from the official nextest release artifacts: version
        # in the URL + the release's own sha256 sidecar value verified below
        # (values cross-checked against cargo-nextest-0.9.149-<target>.sha256).
        # This DELIBERATELY replaces the previous source-install idiom and its
        # ~/.cargo/bin cache: the source build cost ~5.5-6.5m per cold leg, and
        # the cache shielding it was repeatedly LRU-evicted by the multi-GB
        # Cargo.lock-keyed cargo caches each deps bump mints (10GB budget) —
        # run 121784584407 paid the full 6m37s rebuild after a 0s cache
        # restore, and every >50m windows-latest completion includes that
        # rebuild (the cap-kill family on #350 and main; see #347). The
        # tarball download is ~15s, so the flaky cache is no longer
        # load-bearing and the eviction class disappears entirely. macOS uses
        # the universal-apple-darwin artifact (arm64 macos-latest today, both
        # arches covered); Windows uses the tar.gz (not the zip) so one
        # extract idiom serves all three legs (GNU tar in the bash shell reads
        # tar.gz everywhere). Supply-chain posture matches the SHA-pinned
        # actions: first-party artifacts, version + content hash pinned,
        # nothing floating.
        shell: bash
        env:
          NEXTEST_VERSION: "0.9.149"
          # sha256 of cargo-nextest-0.9.149-<target>.tar.gz, from the release
          NEXTEST_SHA_LINUX: "32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770"
          NEXTEST_SHA_MACOS: "47b9941765a9ff94e304a3fe5444ac1c7593da655525b8b69f8f2b31a9217507"
          NEXTEST_SHA_WINDOWS: "8e7609fffb5a938c9b48d8788a89699fc83c39d07a9d9dbc61554f661b51d9d8"
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)   art="x86_64-unknown-linux-gnu"; want="$NEXTEST_SHA_LINUX" ;;
            macOS)   art="universal-apple-darwin";   want="$NEXTEST_SHA_MACOS" ;;
            Windows) art="x86_64-pc-windows-msvc";   want="$NEXTEST_SHA_WINDOWS" ;;
            *) echo "unsupported runner OS: ${{ runner.os }}" >&2; exit 2 ;;
          esac
          url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-${art}.tar.gz"
          tmp="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o "$tmp"
          got="$(sha256sum "$tmp" 2>/dev/null || shasum -a 256 "$tmp")"
          got="${got%% *}"
          if [ "$got" != "$want" ]; then
            echo "cargo-nextest tarball sha256 mismatch for $art: want $want, got $got" >&2
            echo "  $url" >&2
            exit 2
          fi
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$tmp" -C "$HOME/.cargo/bin"
          cargo-nextest --version
      - name: Build test binaries (nextest --no-run)
        # SPLIT build from run (#106): the fused compile+run step could not
        # attribute a stall to build-vs-run, and a job-timeout cancel discards the
        # whole job-log blob (BlobNotFound) — so when the 40-min ubuntu leg was
        # cancelled we were blind to WHERE it stalled. GitHub preserves per-STEP
        # status even when the job-log blob is lost, so building the test binaries
        # in their OWN step reveals whether a future stall is in compile or in run.
        #
        # nextest replaces `cargo test` for the suite (#106): a slow or hung engine
        # integration test becomes a NAMED, time-boxed failure with captured logs
        # (see .config/nextest.toml — slow-timeout terminates a stuck test at
        # ~4 min) instead of silently burning the job budget. Explicit +stable (see
        # fmt job): the 3-OS matrix exercises latest stable per OS; the root pin
        # governs only local bare cargo. MSRV floor: the `msrv` job.
        #
        # `rm -f target/debug/fake_agent*` FORCES a fresh rebuild of the `fake_agent`
        # test helper (kept from the earlier fix). The per-OS `target/` cache can
        # restore a STALE fake_agent whose newer `--emit-usage`/`--dump` args are
        # silently ignored (older `--linger-ms`/`--heartbeat-ms` still work) —
        # failing ONLY the metering integration tests on macOS/Windows while Ubuntu
        # + local pass. The engine passes the launch args correctly; this is a
        # test-harness cache artifact, not a product bug. `shell: bash` so `rm` works
        # on the Windows runner too.
        #
        # Then EXPLICITLY rebuild the bin: unlike `cargo test --all-targets` (which
        # hardlinks the bin to target/debug/fake_agent), `cargo nextest run
        # --all-targets` only compiles it for its own unit tests and does NOT place
        # that top-level hardlink. The process-spawning tests resolve the helper at
        # target/debug/fake_agent (`hekma_conformance::fake_agent_bin`), so without
        # this build the first such tests race on the lib's on-demand `cargo build`
        # fallback (concurrent cargo invocations contend on the build-dir lock —
        # observed as a flake). The explicit build makes the path deterministic.
        # `--no-run` compiles every test binary without executing; the run steps
        # below reuse these artifacts (no double build).
        shell: bash
        run: |
          rm -f target/debug/fake_agent target/debug/fake_agent.exe
          rm -f target/debug/hermes_shim target/debug/hermes_shim.exe
          cargo +stable build -p hekma-conformance --bin fake_agent
          # hermes_shim gets the SAME freshness guard (review-of-6-2, vg-o1):
          # the hermes e2e test resolves it at target/debug/hermes_shim via the
          # same exists()-only locator (install_shim, hekma-engine/tests/
          # hermes.rs), so a cached stale copy would silently shadow the
          # committed launcher's current arg surface (--crash-* family).
          cargo +stable build -p hekma-conformance --bin hermes_shim
          # fake_acp_agent gets the SAME freshness guard (the locator's own
          # contract, story 14-1: "any job that spawns acp agents must build
          # the helper explicitly BEFORE the suite"): the acp_lifecycle suite
          # resolves it at target/debug/fake_acp_agent via the same
          # exists()-only locator (hekma_conformance::fake_acp_agent_bin), and
          # this Cargo.lock-keyed cache can hold a stale copy just the same.
          rm -f target/debug/fake_acp_agent target/debug/fake_acp_agent.exe
          cargo +stable build -p hekma-conformance --bin fake_acp_agent
          cargo +stable nextest run --workspace --all-targets --no-run
      - name: Run tests (nextest)
        # Single unified run for all three OSes (#106). The x86-ubuntu `adoption`
        # hang — concurrent heavy re-exec'd process-spawning wedging the genuine
        # 2-core runner into an uninterruptible D-state — is fixed AT THE SOURCE by
        # the `engine-integration-serial` test-group in .config/nextest.toml
        # (max-threads=1 over `kind(test) & package(hekma-engine)`), which caps the
        # heavy engine integration binaries to one at a time WITHOUT skipping any
        # test (full Linux coverage retained). So no per-OS special-casing, watchdog,
        # or bisect is needed — a per-binary CI bisect had pinned the hang to the
        # `adoption` binary. `retries` + `slow-timeout` in that same config still
        # absorb the windows-latest timing flake and time-box a genuinely stuck test.
        # Explicit +stable (see fmt job): the 3-OS matrix exercises latest stable per
        # OS; the root pin governs only local bare cargo. MSRV floor: the `msrv` job.
        #
        # WALL-CLOCK CAP + SESSION QUARANTINE on the ubuntu leg (2026-10-17
        # wedge forensics): every ubuntu-latest test run on a #281-carrying
        # tree since Oct 16 23:42Z has died at the 40m JOB timeout with NO
        # test ever named — 8+ verified exact-45m cancels (main and PR trees
        # alike) while the healthy lane is ~4.5 minutes end-to-end and
        # macOS/Windows stayed green throughout. One identical tree produced
        # a green-270s run and a wedged-2700s run seconds apart, so the wedge
        # is nondeterministic — and three serialization probes (the #106
        # group, then the CLI integration binary, then the engine lib unit
        # tests; #284) did NOT cure it. nextest's slow-timeout kill cannot
        # name what never dies: the wedge sits BELOW the harness, in a
        # process that ignores even SIGKILL. A cap ALONE cannot fix that:
        # `timeout(1)` WAITS for its child after signalling, so when the
        # 30m cap fired (run 39044536797) the step was still in_progress at
        # +38m, the 40m JOB timeout fired at +40m, and the service
        # force-cancelled at exactly +45m — the post-mortem step below
        # never ran and the job-log blob was destroyed (BlobNotFound),
        # exactly the blindness this instrumentation exists to remove. So
        # the capped leg runs the suite DOUBLE-FORKED into its own session
        # — `( setsid … & )` re-parents the runner to init, outside this
        # shell's process group AND descendant chain — while the step shell
        # SUPERVISES by polling an exit-code file instead of ever waiting
        # on the suite. That bounds the CLASS-1 wedge (a D-state suite on a
        # LIVE runner, the #106 `adoption` shape): a healthy end replays the
        # suite's exit code (and cats the captured output); a cap expiry
        # fails THIS step (exit 124) with the captured suite output + a
        # live process snapshot in the step log — which survives, because
        # a failed-but-completed step is not a cancel — and the still-live
        # quarantined wedged tree stays around for the post-mortem step
        # below to snapshot (its wchan names the stuck kernel path).
        #
        # FALSIFIED FOR CLASS 2 — a full runner freeze (2026-10-17): with
        # this quarantine live, both first runs of the quarantine branch
        # (39048612882 push / 39048623940 pull_request, jobs 117442316042 /
        # 117442346937) still had this step in_progress at the exact
        # +45:00 service force-cancels — the 30m supervisor cap never
        # fired, the post-mortem steps never ran, and both job-log blobs
        # came back BlobNotFound. The supervisor mechanism itself is
        # proven (dev-box smoke: a 2s cap against a 60s suite exits 124
        # with the markers; the healthy path replays exit 0), so when
        # THIS wedge hits the runner has stopped executing the step shell
        # itself — a machine-level freeze below any in-job containment;
        # only the service-side clock terminates it, and it destroys the
        # logs on the way out. For class 2 the only lever left is the
        # ENVIRONMENT, so this matrix's linux leg is pinned to
        # ubuntu-26.04 (kernel 7.0.0-1012-azure vs the wedging 24.04
        # image's 6.17.0-1022-azure; GA for production) — which is where
        # ubuntu-latest is migrating anyway (actions/runner-images#14748,
        # rollout Oct 19–Nov 19 2026), so the pin carries no migration
        # debt; unify back to ubuntu-latest once that migration
        # completes. Corroboration that this is a tree×24.04-kernel
        # interaction, not a fleet incident: bite-mcp's ubuntu-latest CI
        # stayed green through the same window, and hekma main run
        # 39016343545 ran the SAME ubuntu suite green in 4m36s at 08:10Z
        # the same day — the trigger is nondeterministic. The pinned
        # leg's JOB timeout drops to 15m (matrix data below): a class-2
        # recurrence on 26.04 costs the 15+5m service window, not 45m,
        # and surfaces as a fast visible cancel. The cap rides the
        # matrix `include` as data; the other legs render an empty cap
        # and run the plain uncapped invocation. Tracking issue: #292.
        shell: bash
        run: |
          CAP="${{ matrix.nextest_wallclock_cap }}"
          PROFILE="${{ matrix.nextest_profile }}"
          if [ -z "$CAP" ]; then
            # Uncapped leg: plain foreground invocation, untouched semantics
            # except the profile flag (matrix data; "default" is explicit-
            # valid and behavior-identical for the legs that keep it).
            exec cargo +stable nextest run --workspace --all-targets --profile "$PROFILE"
          fi
          # Capped leg: double-fork the suite into its own session and
          # supervise. `setsid` plus the backgrounding subshell re-parent the
          # runner to init — nothing in THIS step's process tree waits on it,
          # which is what lets the step terminate even when the suite wedges
          # below SIGKILL. The inner script records its pid, runs the suite
          # with stdin detached and output captured, then records the exit
          # code; no `set -e` there BY DESIGN — the code must be recorded
          # whatever happens.
          LOG="$RUNNER_TEMP/nextest-run.log"
          PIDF="$RUNNER_TEMP/nextest.pid"
          EXITF="$RUNNER_TEMP/nextest.exit"
          rm -f "$PIDF" "$EXITF"
          # The cap is expressed in minutes (matrix data, e.g. 30m).
          CAPS=$(( ${CAP%m} * 60 ))
          (
            setsid bash -c '
                  pidf=$1; exitf=$2; shift 2
                  echo $$ > "$pidf"
                  "$@"
                  echo $? > "$exitf"
                ' quarantine "$PIDF" "$EXITF" \
              cargo +stable nextest run --workspace --all-targets \
              --profile "$PROFILE" \
              < /dev/null > "$LOG" 2>&1 &
          )
          START=$SECONDS
          HEART=0
          while true; do
            if [ -f "$EXITF" ]; then
              break
            fi
            NOW=$(( SECONDS - START ))
            if [ "$NOW" -ge "$CAPS" ]; then
              break
            fi
            if [ $(( NOW - HEART )) -ge 60 ]; then
              HEART=$NOW
              echo "[supervisor] suite running for ${NOW}s; recent output:"
              tail -c 800 "$LOG" 2>/dev/null || true
              echo
            fi
            sleep 5
          done
          if [ -f "$EXITF" ]; then
            cat "$LOG"
            CODE=$(cat "$EXITF")
            echo "[supervisor] suite exited with code $CODE after $(( SECONDS - START ))s"
            exit "$CODE"
          fi
          echo "[supervisor] WALL-CLOCK CAP HIT at +$(( SECONDS - START ))s — the suite did not finish"
          echo "[supervisor] ===== full suite output so far ====="
          cat "$LOG"
          echo "[supervisor] ===== live process table (quarantined tree included; stat D = uninterruptible) ====="
          ps -eo pid,ppid,pgid,sid,stat,wchan:32,etimes,comm,args --sort=etimes || true
          echo "[supervisor] ===== suite-related survivors ====="
          ps -eo pid,stat,args 2>/dev/null | grep -E "nextest|fake_agent|fake_acp_agent|hermes_shim|hekma" | grep -v grep || echo "(none)"
          exit 124
      - name: Wedge post-mortem snapshot (process table + pressure)
        # Always runs — also when the capped run step above FAILED on its
        # wall-clock expiry, which is exactly when it matters: the wedged
        # processes are still alive at this point, so the full process table
        # with stat + wchan (an uninterruptible D-state leftover shows its
        # kernel wait channel), PSI pressure, and the leftover helper binaries
        # land in the step log AND in an artifact (a cancelled job loses its
        # whole log blob; a failed-step job does not — and the artifact rides
        # along either way). ~2s on a healthy run. Linux gets the deep set
        # (wchan/PSI are procfs); the other OSes echo their plain tables.
        if: always()
        shell: bash
        run: |
          {
            echo "== wedge post-mortem: $(date -u) =="
            uname -a || true
            echo "nproc=$(nproc 2>/dev/null || echo '?')"
            uptime 2>/dev/null || true
            free -m 2>/dev/null || true
            if [ "$(uname -s)" = "Linux" ]; then
              echo "== PSI (cpu/io/memory) =="
              for f in /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory; do
                echo "-- $f"; cat "$f" 2>/dev/null || true
              done
              echo "== process table (oldest first; stat D = uninterruptible) =="
              ps -eo pid,ppid,pgid,stat,wchan:32,etimes,comm,args --sort=etimes || true
            else
              echo "== process table =="
              ps -ef 2>/dev/null || true
            fi
            echo "== suite-related leftovers =="
            ps -eo pid,stat,args 2>/dev/null | grep -E "nextest|fake_agent|fake_acp_agent|hermes_shim|hekma" | grep -v grep || echo "(none)"
          } | tee "$RUNNER_TEMP/wedge-postmortem.txt"
      - name: Upload wedge post-mortem artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wedge-postmortem-${{ matrix.os }}
          path: ${{ runner.temp }}/wedge-postmortem.txt
          if-no-files-found: ignore
      - name: Run doctests
        # nextest does not run doctests, so run them separately to keep the doc
        # examples gated (`--doc` and `--all-targets` cannot combine in one cargo
        # invocation). Explicit +stable (see fmt job).
        run: cargo +stable test --workspace --doc

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build release binary
        # Explicit +stable (see fmt job): CI build sanity on latest stable; the
        # root pin governs only local bare cargo.
        run: cargo +stable build --release
      - name: Build the embedding quickstart example (story 7-4)
        # The publish capstone's compile-level proof: the quickstart is HOST
        # code — it links only hekma-engine's public facade (no kt, no
        # hekma-conformance) — so building it in CI proves the embedding
        # surface compiles from outside the engine crate, exactly what a
        # crates.io host will do once the HELD publish runs
        # (docs/release-process.md). Keeping the build in this job means a
        # facade regression reds the ordinary build gate before any host ever
        # sees it. Explicit +stable (see fmt job).
        run: cargo +stable build --release --example embedding-quickstart -p hekma-engine
      - name: Run the embedding quickstart (hermetic)
        # Ubuntu-scoped BY JOB DESIGN: this whole `build` job runs on
        # ubuntu-latest only (the build matrix is the `test` job's), so the
        # run step needs no `runner.os == 'Linux'` guard — the binary path
        # (`target/release/examples/embedding-quickstart`, no .exe suffix)
        # can never meet a Windows/macOS runner here. The example itself is
        # still COMPILED on all three OS legs (see the embed-clean/build
        # surfaces that run in the 3-OS `test` matrix); only the hermetic
        # run is ubuntu-scoped.
        # The example is also RUNNABLE hermetically, so this gate is "works",
        # not just "compiles": its only subprocess is a re-exec of itself
        # idling under a hard 120 s cap (see the example's header), everything
        # runs on a per-process temp-dir root, and every leg (register →
        # configure → subscribe → start → observe → stop) ASSERTS instead of
        # printing — the configure read-back, the at-least-one-event drain,
        # the running state, and the Fleet budget row — so a failure exits
        # nonzero and reds this job. One short-lived process spawn, no
        # external service, no network, no fixture crates. The step-level
        # timeout is independent of (and far tighter than) the agent's own
        # 120 s idle cap, and the binary is asserted present first so a
        # build-step regression fails with a CLEAR message, not a confusing
        # "file not found".
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/examples/embedding-quickstart || {
            echo "::error::embedding-quickstart binary not found at target/release/examples/embedding-quickstart — the build step above failed or the output path moved."
            exit 1
          }
          target/release/examples/embedding-quickstart

  perf-budgets:
    name: perf-budgets
    # Story 7-5 (NFR-4): the DESIGNATED performance job. NFR-4's budgets
    # (reads < 1s on a 25-instance Fleet; supervision overhead <= 2% CPU and
    # <= 50MB RSS per running instance) are benchmarked here on every PR —
    # measured, not assumed — and a regression FAILS this job (blocking; the
    # run step is never allowed to fail). Gate policy (the harness prints it,
    # with all measured numbers, as a JSON report in this job's log — the
    # measured record of record, also uploaded as this job's artifact): reads
    # p99 and RSS/instance gate hard at budget; CPU/instance gates strict
    # (x1.0) locally and carries the harness's DOCUMENTED shared-runner
    # tolerance (x1.5, named in the report) over the MEDIAN OF THREE windows
    # here, because a hosted runner's co-tenant noise is uncontrollable.
    # Gated separately from the standard test matrix (a dedicated ubuntu job,
    # not a matrix leg) so the measurement is comparable run-to-run and
    # perf-noise flakiness can never spill into the ordinary test gates.
    # Story 15-5: this leg is also the RATCHET gate platform — it runs with
    # --baseline against the committed canonical baseline
    # (benches/baselines/perf-ubuntu-x86_64.json) and fails when any gated
    # metric is worse than baseline x 1.15 (additive to the absolute
    # budgets; see docs/testing.md's update procedure for refreshes).
    # Story 17-1: the job ALSO runs the serve-shape scenario (--serve-shape,
    # its own step below) — the NFR-4 budgets re-measured
    # through the engine's PUBLIC async facade under serve-shaped
    # concurrency, gated by the serve gates (their own names; bound only on
    # serve runs; not ratcheted — the canonical baseline carries no serve
    # metrics). Its report file rides the SAME artifact as the default
    # report (two files, one artifact).
    runs-on: ubuntu-latest
    # Story 17-1: the job now runs the harness TWICE (default + --serve-shape,
    # ~2 min more on a warm cache) — the ceiling grows with it.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build the perf harness (release profile)
        # Release profile: the measurement must not pay dev-profile build
        # noise. Explicit +stable (see fmt job): the root rust-toolchain.toml
        # pins only local bare cargo; MSRV floor: the `msrv` job.
        run: cargo +stable build --release -p hekma-engine --example perf-budgets
      - name: Rebuild the fake_agent helper (stale-helper guard)
        # The SAME stale-helper guard the test + coverage jobs carry (and
        # scripts/test_automation.py enforces for any job that spawns
        # agents): this job's target/ cache key is Cargo.lock-derived, so a
        # helper-only change cannot bust it and a frozen binary would
        # silently ignore newer flags (unknown args are `_ => {}`). The
        # harness resolves the helper at target/release/fake_agent; rm +
        # explicit rebuild makes that deterministic instead of racing the
        # lib's on-demand build fallback (the build-dir lock contention
        # flake). hermes_shim is NOT needed here — the harness spawns only
        # fake_agent.
        shell: bash
        run: |
          rm -f target/release/fake_agent target/release/fake_agent.exe
          cargo +stable build --release -p hekma-conformance --bin fake_agent
      - name: Run the perf harness (NFR-4 budgets; regressions fail this job)
        # Blocking by design: a budget regression (reads p99 over 1s, RSS
        # over 50 MiB/instance or its 2x spike guard, CPU over its applicable
        # budget) exits nonzero and reds this job, per the AC "regressions
        # fail the perf job". The runner's ambient CI=true env switches the
        # harness into its documented CI mode (median-of-3 windows + the
        # tolerance, and the reads gate's one 30s-cool-down retry). The env
        # var also makes the harness write the JSON report to a file, which
        # the step below uploads as the job's artifact — the run line itself
        # stays the bare binary invocation (+ its flags) so the step cannot
        # silently swallow a nonzero exit.
        # Story 15-5: the run carries --baseline against the COMMITTED
        # canonical baseline (benches/baselines/perf-ubuntu-x86_64.json), so
        # this leg ALSO ratchet-gates: any gated metric worse than
        # max(baseline x 1.15, baseline + noise floor) fails the run
        # (additive to the absolute budgets). On a failure the trend block
        # is already IN this job's log — the harness prints every ratchet
        # verdict (baseline/current/delta/limit) to stderr and the full
        # trend JSON to stdout, with no redirection here — and the artifact
        # step below preserves the numbers (if: always()). A missing/
        # corrupt/schema-mismatched baseline is the harness's OWN loud
        # exit 2 (review round 1: one path — no shell `test -f` guard
        # duplicating it), which reds this job the same way.
        timeout-minutes: 10
        env:
          PERF_BUDGETS_REPORT_PATH: perf-budgets-report.json
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/examples/perf-budgets || {
            echo "::error::perf-budgets binary not found at target/release/examples/perf-budgets — the build step above failed or the output path moved."
            exit 1
          }
          target/release/examples/perf-budgets --baseline benches/baselines/perf-ubuntu-x86_64.json
      - name: Run the serve-shape scenario (story 17-1; regressions fail this job)
        # The SECOND explicit run (story 17-1): gated budgets CI never runs
        # are not gates, so the serve shape is its own blocking step, not a
        # rider on the default run above. It runs WITHOUT --baseline — the
        # canonical baseline carries no serve metrics, and the serve gates
        # bind only on serve runs (the scenario-scoped baseline rule in
        # docs/testing.md) — and gates the NFR-4 budgets through the three
        # serve gates (read p99 < 1s; CPU <= 2%/instance at the shared-runner
        # tolerance; RSS <= 50 MiB/instance). Same contract as the step
        # above: no redirection, no `|| true`, the bare binary invocation
        # (+ its flags) as the last line, so a nonzero exit reds this job.
        timeout-minutes: 10
        env:
          PERF_BUDGETS_REPORT_PATH: perf-budgets-serve-report.json
        shell: bash
        run: |
          set -euo pipefail
          test -x target/release/examples/perf-budgets || {
            echo "::error::perf-budgets binary not found at target/release/examples/perf-budgets — the build step above failed or the output path moved."
            exit 1
          }
          target/release/examples/perf-budgets --serve-shape
      - name: Upload the measured report (artifact)
        # The measured record of record also lives in this job's log; the
        # artifact makes it downloadable for trend inspection. `if: always()`
        # so a red (regression) run's numbers are preserved too — that is
        # exactly when the record matters most. Story 17-1: ONE artifact
        # carries BOTH report files (the default run's and the serve run's).
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-budgets-report
          path: |
            perf-budgets-report.json
            perf-budgets-serve-report.json
          if-no-files-found: warn

  agents-in-ci:
    name: agents-in-ci
    # FR-47's dogfood lane: the agents-in-CI recipe (docs/agents-in-ci.md)
    # run END-TO-END in this repository's own CI, on every PR — the lane is
    # the recipe's test, so the page cannot silently rot. Two deterministic
    # legs against the BRANCH-BUILT binary (this commit under test, no
    # release download, no egress — the page documents the tag-pinned musl
    # download users copy; the lane's build step is the one part not copied):
    #   * success leg — generous ceiling, the fake_agent's KNOWN batch
    #     (5 events x (10 in + 20 out)) polls to committed, the summary
    #     renders tokens + labeled dollars from `usage --json`/`show --json`,
    #     exit 0;
    #   * breach leg — the proven 90-token ceiling (crossed at event 3)
    #     pauses the agent; there is NO breach exit code (0-6 only), so the
    #     leg proves the breach from the PUBLIC surface — the paused Fleet
    #     row + its budget fields on `show --json` — and NAMES the breach in
    #     the summary. No path masks a breach as success: continue-on-error
    #     stays false and a leg that cannot prove its expected state fails
    #     loudly with the last JSON blob printed, never a bare timeout.
    # Determinism: every wait polls for a KNOWN committed state (the start
    # session's reaper drains the batch before `start --detach` returns) —
    # never a wall-clock sleep. The whole job shares the workflow's
    # `permissions: contents: read` and is wall-clock bounded at
    # `timeout-minutes: 15`; the fake agent calls nothing and no secret is
    # involved.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build the branch hekma + fake_agent (stale-helper guard)
        # The SAME rm+rebuild freshness guard the test/coverage/perf jobs
        # carry: this job's target/ cache key is Cargo.lock-derived, so a
        # helper-only change cannot bust it and a frozen binary would
        # silently ignore newer flags (fake_agent ignores unknown args).
        # rm + explicit rebuild makes both binaries deterministic instead
        # of racing a stale cache hit. Explicit +stable (see the fmt job):
        # the root rust-toolchain.toml pins only local bare cargo.
        shell: bash
        run: |
          rm -f target/release/hekma target/release/hekma.exe
          rm -f target/release/fake_agent target/release/fake_agent.exe
          cargo +stable build --release -p hekma -p hekma-conformance --bin hekma --bin fake_agent
      - name: Success leg — generous ceiling, known batch, labeled-dollar summary
        # The recipe's happy path end to end: register from the checked-in
        # fixture manifest (the __FAKE_AGENT_BIN__ placeholder substituted
        # with the absolute branch-built path), arm a generous ceiling +
        # rates, start detached, poll `usage --json` for the KNOWN committed
        # batch, assert the agent is still running (no breach), render the
        # `## Agents in CI` summary block from `usage --json` + `show --json`
        # (tokens; micro-dollars with the `estimated` label; cached/dollars
        # honesty — `—` when absent, never a fabricated 0/$0.00), stop, and
        # assert the terminal state. The renderer is the docs page's §4
        # snippet verbatim; the assertions around it are the lane's own.
        env:
          # Belt-and-braces: the update check already auto-skips under
          # CI=true, which GitHub runners always set.
          KTESIO_NO_UPDATE_CHECK: "1"
        shell: bash
        run: |
          set -euo pipefail
          leg="$RUNNER_TEMP/lane-success"
          mkdir -p "$leg/state" "$leg/manifest"
          export KTESIO_STATE_DIR="$leg/state"
          hekma="target/release/hekma"
          sed "s|__FAKE_AGENT_BIN__|$PWD/target/release/fake_agent|" \
            .github/fixtures/agents-in-ci-adapter.toml > "$leg/manifest/adapter.toml"
          "$hekma" agent register ci-bot --manifest "$leg/manifest"
          "$hekma" agent config set ci-bot budget.tokens.cumulative 100000
          "$hekma" agent config set ci-bot budget.breach_action pause
          "$hekma" agent config set ci-bot cost.rate.input 3.00
          "$hekma" agent config set ci-bot cost.rate.output 15.00
          "$hekma" agent start ci-bot --detach
          committed=""
          for i in $(seq 1 60); do
            "$hekma" agent usage ci-bot --json > "$leg/usage.json" || { sleep 1; continue; }
            in_tok=$(jq -r '.usage.cumulative_input_tokens // 0' "$leg/usage.json") \
              || { echo "::error::success leg: malformed usage JSON"; cat "$leg/usage.json"; exit 1; }
            out_tok=$(jq -r '.usage.cumulative_output_tokens // 0' "$leg/usage.json") \
              || { echo "::error::success leg: malformed usage JSON"; cat "$leg/usage.json"; exit 1; }
            if [ "$in_tok" -ge 50 ] && [ "$out_tok" -ge 100 ]; then committed=1; break; fi
            sleep 1
          done
          if [ -z "$committed" ]; then
            echo "::error::success leg: usage never reached the known 50-in/100-out batch; last read:"
            cat "$leg/usage.json"
            exit 1
          fi
          "$hekma" agent show ci-bot --json > "$leg/show.json"
          state=$(jq -r '.instance.state // empty' "$leg/show.json") \
            || { echo "::error::success leg: malformed show JSON"; cat "$leg/show.json"; exit 1; }
          if [ "$state" != "running" ]; then
            echo "::error::success leg: expected running before stop, got: $state"
            cat "$leg/show.json"
            exit 1
          fi
          # The budget block must be present on the happy path too (the
          # breach leg validates its enforcement; this pins its projection).
          s_limit=$(jq -r '.instance.budget.cumulative_limit // empty' "$leg/show.json")
          s_action=$(jq -r '.instance.budget.breach_action // empty' "$leg/show.json")
          if [ "$s_limit" != "100000" ] || [ "$s_action" != "pause" ]; then
            echo "::error::success leg: show --json budget block missing/wrong (limit=$s_limit action=$s_action)"
            cat "$leg/show.json"
            exit 1
          fi
          # Deterministic money math, asserted: 50 in x $3/1M + 100 out x
          # $15/1M = 1650 micro-dollars, labeled estimated (AI-55 class:
          # money surfaces get proven, not rendered-and-hoped).
          cost="— (no rate configured)"
          if jq -e '.usage.cumulative_dollars' "$leg/usage.json" > /dev/null; then
            micros=$(jq -r '.usage.cumulative_dollars' "$leg/usage.json")
            label=$(jq -r '.usage.estimate_label // empty' "$leg/usage.json")
            if [ "$micros" != "1650" ] || [ "$label" != "estimated" ]; then
              echo "::error::success leg: expected 1650 estimated micro-dollars, got: $micros ($label)"
              cat "$leg/usage.json"
              exit 1
            fi
            cost=$(awk -v m="$micros" -v l="$label" 'BEGIN { printf "$%.6f (%s)", m / 1000000, l }')
          else
            echo "::error::success leg: rates were configured, yet cumulative_dollars is absent"
            cat "$leg/usage.json"
            exit 1
          fi
          cached=$(jq -r '.usage.cumulative_cached_tokens // empty' "$leg/usage.json")
          [ -n "$cached" ] && [ "$cached" -gt 0 ] || cached="—"
          {
            echo "## Agents in CI — success leg"
            echo ""
            echo "ci-bot ran under a generous 100000-token budget, committed its"
            echo "whole known batch (50 in / 100 out), and stayed within budget."
            echo ""
            echo "| agent | state | input tok | output tok | cached tok | cost |"
            echo "|-------|-------|-----------|------------|------------|------|"
            printf '| %s | %s | %s | %s | %s | %s |\n' \
              ci-bot "$state" "$in_tok" "$out_tok" "$cached" "$cost"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          "$hekma" agent stop ci-bot --timeout 0
          # The terminal state is asserted, not assumed: a stop that left the
          # agent in any non-stopped state fails the leg by name.
          "$hekma" agent show ci-bot --json > "$leg/final.json"
          final=$(jq -r '.instance.state // empty' "$leg/final.json")
          if [ "$final" != "stopped" ]; then
            echo "::error::success leg: expected stopped after stop --timeout 0, got: $final"
            cat "$leg/final.json"
            exit 1
          fi
      - name: Breach leg — the 90-token ceiling pauses the agent; the row proves it
        # The proven recipe: fixed 10-in/20-out sentinels against a cumulative
        # ceiling of 90 tokens crosses at event 3. No rate is configured on
        # this leg, and the summary's dollar cell renders the honest absence
        # (`—`, never a fabricated $0.00) only AFTER the absence is asserted
        # from `usage --json`. The breach proof is the paused
        # Fleet row + budget fields (cumulative_limit 90, remaining clamped
        # to 0, breach_action pause) read through `show --json` — the CLI
        # has no breach exit code and the lane does not pretend otherwise.
        env:
          KTESIO_NO_UPDATE_CHECK: "1"
        shell: bash
        run: |
          set -euo pipefail
          leg="$RUNNER_TEMP/lane-breach"
          mkdir -p "$leg/state" "$leg/manifest"
          export KTESIO_STATE_DIR="$leg/state"
          hekma="target/release/hekma"
          sed "s|__FAKE_AGENT_BIN__|$PWD/target/release/fake_agent|" \
            .github/fixtures/agents-in-ci-adapter.toml > "$leg/manifest/adapter.toml"
          "$hekma" agent register ci-breach --manifest "$leg/manifest"
          "$hekma" agent config set ci-breach budget.tokens.cumulative 90
          "$hekma" agent config set ci-breach budget.breach_action pause
          "$hekma" agent start ci-breach --detach
          paused=""
          for i in $(seq 1 60); do
            "$hekma" agent show ci-breach --json > "$leg/show.json" || { sleep 1; continue; }
            state=$(jq -r '.instance.state // empty' "$leg/show.json")
            limit=$(jq -r '.instance.budget.cumulative_limit // empty' "$leg/show.json")
            remaining=$(jq -r '.instance.budget.cumulative_remaining // empty' "$leg/show.json")
            action=$(jq -r '.instance.budget.breach_action // empty' "$leg/show.json")
            if [ "$state" = "paused" ] && [ "$limit" = "90" ] && [ "$remaining" = "0" ] && [ "$action" = "pause" ]; then
              paused=1
              break
            fi
            sleep 1
          done
          if [ -z "$paused" ]; then
            echo "::error::breach leg: the agent never reached paused with its budget fields within the bound; last read:"
            cat "$leg/show.json"
            exit 1
          fi
          in_tok=$(jq -r '.instance.usage.cumulative_input_tokens // 0' "$leg/show.json")
          out_tok=$(jq -r '.instance.usage.cumulative_output_tokens // 0' "$leg/show.json")
          total=$((in_tok + out_tok))
          if [ "$total" -lt 90 ]; then
            echo "::error::breach leg: the paused row shows only $total committed tokens, below the 90 ceiling"
            cat "$leg/show.json"
            exit 1
          fi
          # The honest absence is ASSERTED, not assumed: no rate is
          # configured on this leg, so both dollar fields must be absent
          # from `usage --json` — a regression that fabricated a $0.00
          # (or an unlabeled figure) fails right here.
          "$hekma" agent usage ci-breach --json > "$leg/usage.json"
          jq -e '(.usage.cumulative_dollars == null) and (.usage.estimate_label == null)' \
            "$leg/usage.json" > /dev/null \
            || { echo "::error::breach leg: no rate configured, yet dollars/label are present in usage --json"; cat "$leg/usage.json"; exit 1; }
          {
            echo "## Agents in CI — breach leg"
            echo ""
            echo "ci-breach crossed its cumulative ceiling of ${limit} tokens"
            echo "(committed ${total}: ${in_tok} in / ${out_tok} out) and was paused by the"
            echo "configured Breach Action (\`${action}\`). There is no dedicated breach"
            echo "exit code — this paused Fleet row IS the proof."
            echo ""
            echo "| agent | state | ceiling tok | remaining | breach action | committed tok | cost |"
            echo "|-------|-------|-------------|-----------|---------------|---------------|------|"
            printf '| %s | %s | %s | %s | %s | %s | — (no rate configured) |\n' \
              ci-breach "$state" "$limit" "$remaining" "$action" "$total"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          "$hekma" agent stop ci-breach --timeout 0

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate docs
        run: python3 scripts/check_docs.py
      - name: Validate the docs-gate self-test (provenance-regex pins)
        # The gate's own regex contract (19-1 review round 1): the `retro`
        # provenance pattern's match/no-match samples, pinned so the pattern
        # cannot silently re-open the hyphen-joined provenance hole (or break
        # the `no-retro-repricing` wire token's verbatim quoting).
        run: python3 scripts/check_docs.py --self-test
      - name: Validate release doc generation
        run: python3 scripts/generate_release_docs.py v0.0.0 --output-dir target/release-docs-test
      - name: Test automation helpers
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_automation.py
      - name: Install docs site dependencies
        run: npm ci --prefix docs
      - name: Build docs site
        run: npm run --prefix docs build

  boundary:
    name: boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check hekma against its declared crate graph
        # Explicit +stable (see fmt job): boundary gate runs on latest stable; the
        # root rust-toolchain.toml pins only local bare cargo. MSRV floor: `msrv` job.
        run: cargo +stable check -p hekma
      - name: Enforce kt dependency law (AD-2)
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo +stable tree -p hekma -e normal,build --all-features)"
          echo "$tree"
          # Allowlist, not blocklist: any internal hekma-* edge other than
          # hekma-engine / hekma-adapter-api / hekma-adapters-hermes fails,
          # so future internal crates are caught automatically.
          scan_status=0
          edges="$(printf '%s\n' "$tree" | grep -oE 'hekma-[a-z0-9_-]+' | sort -u)" || scan_status=$?
          if [ "$scan_status" -ge 2 ]; then
            echo "::error::grep exited ${scan_status} while extracting internal crate edges."
            exit "$scan_status"
          fi
          violations=''
          if [ -n "$edges" ]; then
            filter_status=0
            violations="$(printf '%s\n' "$edges" | grep -Evx 'hekma-(engine|adapter-api|adapters-hermes|host)')" || filter_status=$?
            if [ "$filter_status" -ge 2 ]; then
              echo "::error::grep exited ${filter_status} while applying the internal-crate allowlist."
              exit "$filter_status"
            fi
          fi
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::kt may depend only on hekma-engine (plus hekma-adapter-api types, the hekma-adapters-hermes builtin, and hekma-host for the serve subcommand); forbidden internal crate edge found."
            # WHY the adapters-hermes edge is allowed (review blind-22): it is
            # the builtin native-adapter table the engine's `native()` matcher
            # consults to resolve `--kind hermes` — code, not a plugin, so the
            # shipping binary carries it. WHY the hekma-host edge is allowed
            # (story 17-2, AD-2 amendment 2026-10-19): the `serve` subcommand's
            # engine — the long-running Service Host drives the engine's
            # public API; the CLI source stays synchronous (no tokio dep in
            # kt itself). Any OTHER internal crate must stay out of kt's
            # graph (mock/dev fixtures ride dev-dependencies only).
            exit 1
          fi
          echo "Boundary gate green: internal edges are exactly the allowlisted hekma-engine / hekma-adapter-api / hekma-adapters-hermes / hekma-host."
      - name: Enforce the one-rustls/ring TLS invariant (story 12-3, NFR-8)
        shell: bash
        run: |
          set -euo pipefail
          # The TLS philosophy is ONE vendored rustls+ring across the WHOLE
          # workspace (no system TLS, no openssl/native-tls, no second copy of
          # rustls or ring drifting in via a transitive dep, no aws-lc-sys
          # provider). This is the CI TEETH for that invariant: the WORKSPACE
          # graph (kt + hekma-engine + the adapter crates — review round 2
          # widened the scan from engine-only, so a TLS crate smuggled in via
          # kt or an adapter cannot slip past an engine-scoped gate) must
          # carry EXACTLY ONE `rustls` package and EXACTLY ONE `ring`
          # package, and NO system-TLS binding may appear at all.
          # (`grep -oE` + `sort -u` dedups the tree's repeated renders of the
          # same package under different parents; the `── <name> v` shape
          # matches the package token exactly, so `hyper-rustls` /
          # `rustls-pki-types` / `rustls-webpki` do not count as `rustls`.)
          tree="$(cargo +stable tree --workspace -e normal)"
          echo "$tree"
          rustls_copies="$(printf '%s\n' "$tree" | grep -oE '── rustls v[0-9.]+' | sort -u)" || true
          ring_copies="$(printf '%s\n' "$tree" | grep -oE '── ring v[0-9.]+' | sort -u)" || true
          echo "rustls copies: $rustls_copies"
          echo "ring copies:   $ring_copies"
          if [ "$(printf '%s\n' "$rustls_copies" | grep -c . )" -ne 1 ]; then
            echo "::error::Expected exactly ONE rustls package in the workspace graph (NFR-8: one vendored rustls), found: $rustls_copies"
            exit 1
          fi
          if [ "$(printf '%s\n' "$ring_copies" | grep -c . )" -ne 1 ]; then
            echo "::error::Expected exactly ONE ring provider package in the workspace graph (NFR-8: one vendored ring), found: $ring_copies"
            exit 1
          fi
          if printf '%s\n' "$tree" | grep -qE '── (aws-lc|openssl|native-tls|schannel|security-framework)'; then
            echo "::error::Forbidden TLS binding (aws-lc/openssl/native-tls/schannel/security-framework) found in the workspace graph (NFR-8: no system TLS, the vendored rustls+ring pair only)."
            exit 1
          fi
          echo "TLS invariant gate green: exactly one rustls + one ring, no system-TLS binding, workspace-wide."
      - name: Enforce OS-conditional code location (engine backends only)
        shell: bash
        run: |
          set -euo pipefail
          # Class pattern: catches #[cfg(unix)], #[cfg(not(windows))],
          # #[cfg(all(unix, ...))], #[cfg(any(...))], cfg!(...), and
          # #[cfg_attr(...)] forms naming an OS token.
          pattern='cfg[!(]?.*(unix|windows|target_os|target_family)'
          # Allowlist: engine backends (the convention home, spine AD-4) plus
          # two pre-existing v0.5.0 legacy CLI files (self-update platform
          # detection) grandfathered until epic 8 relocates/deprecates them
          # (AC-4 amendment, ratified 2026-07-02; paths updated for the
          # v0.8.0 crates/kt -> crates/hekma move), plus engine integration
          # TEST files enumerated ONE BY ONE (2026-09-22 hardening: the old
          # directory-wide tests/ allowlist let any future test file add
          # OS-cfg silently; the teeth are per-file now) — each with its
          # justification:
          #   * atomic_config_writes.rs — 11-2's atomic-write tests inject
          #     failure via unix-only syscalls; the suite is #[cfg(unix)].
          #   * memory.rs — the symlink-containment test (story 5-1) is the
          #     honestly unix-gated suite under the AI-35 disclosure
          #     convention ("the test does not exist on Windows" rather than
          #     passing vacuously).
          #   * conformance test_notes.rs — the uncaptured-note helper's
          #     write arms ARE the OS API boundary: std::os::unix::io /
          #     std::os::windows::io exist per-OS, so importing the raw
          #     fd/handle constructors cannot be made data-driven (OsId
          #     cannot import a platform-only trait). The arms are the
          #     boundary gate's own sanctioned class.
          #   * conformance test_support.rs — the fixture writer's
          #     non-UTF-8-exec panic test needs an OsStr that is not valid
          #     Unicode as INPUT, and constructing one exists only through
          #     per-OS std APIs (std::os::unix::ffi::OsStrExt::from_bytes /
          #     std::os::windows::ffi::OsStringExt::from_wide) — the same
          #     "the constructor is the OS API boundary" class as
          #     test_notes.rs above; the asserted contract (loud panic, no
          #     munge, nothing written) is OS-uniform.
          #   * conformance tck.rs — story 15-3's EngineOpen stage drive
          #     needs an EMPTY-but-UNWRITABLE state root (the fresh-root
          #     contract refuses any non-empty root at StateRoot first), and
          #     directory write-denial exists only through the unix
          #     permission model (PermissionsExt); the test is #[cfg(unix)]
          #     with a root-runner honesty skip.
          # adoption/interaction suites deliberately use NO cfg (data-driven
          # OS ids); no production code may use cfg outside backends/.
          #   * hekma-host signals.rs — story 17-2: the host OWNS the
          #     shutdown-signal wait (AD-20: process signals are the host's,
          #     never the engine's), and tokio's signal API is inherently
          #     per-OS (SIGTERM/SIGINT streams on Unix, ctrl_c on Windows —
          #     there is no data-driven OsId form for a signal STREAM). The
          #     file is the crate's ONLY cfg; the wait is thin and its
          #     Windows half is the documented OS asymmetry.
          #   * hekma-host tests/control_api.rs — story 17-3: the suite's
          #     bearer resolves through the engine's SECRETS-FILE leg, whose
          #     0600 refusal is a unix permission-model check (PermissionsExt),
          #     so exercising the happy path means WRITING a 0600 secrets file
          #     — the same "the write arms ARE the OS API boundary" class as
          #     the engine's atomic_config_writes.rs entry (on Windows the
          #     file-leg ACL check accepts a fresh user-owned file, so the
          #     write is bare; the gate itself — the agent-driving tests'
          #     Windows skip — is data-driven OsId::current, never cfg).
          #   * hekma tests/serve_cli.rs — story 17-3 (review item 24b): the
          #     real-binary Control-API leg writes the SAME 0600 secrets file
          #     so the spawned serve resolves the bearer through the file leg
          #     — the identical sanctioned class as the host suite's entry.
          #   * hekma-host tests/binary_flags.rs — story 17-4: the binary's
          #     --log-capture e2e leg writes the SAME 0600 secrets file so
          #     the spawned host resolves the bearer through the file leg —
          #     the identical sanctioned class as the control_api.rs entry
          #     above; the leg's Windows skip stays data-driven OsId::current.
          allowlist='^crates/hekma-engine/src/backends/|^crates/hekma/src/update_check\.rs:|^crates/hekma/src/cli/self_update\.rs:|^crates/hekma-engine/tests/atomic_config_writes\.rs:|^crates/hekma-engine/tests/memory\.rs:|^crates/hekma-conformance/src/tck\.rs:|^crates/hekma-conformance/src/test_notes\.rs:|^crates/hekma-conformance/src/test_support\.rs:|^crates/hekma-host/src/signals\.rs:|^crates/hekma-host/tests/control_api\.rs:|^crates/hekma-host/tests/binary_flags\.rs:|^crates/hekma/tests/serve_cli\.rs:'
          scan_status=0
          hits="$(grep -rn --include='*.rs' -E "$pattern" crates/)" || scan_status=$?
          if [ "$scan_status" -ge 2 ]; then
            echo "::error::grep exited ${scan_status} while scanning for OS-conditional code."
            exit "$scan_status"
          fi
          violations=''
          if [ -n "$hits" ]; then
            filter_status=0
            violations="$(printf '%s\n' "$hits" | grep -Ev "$allowlist")" || filter_status=$?
            if [ "$filter_status" -ge 2 ]; then
              echo "::error::grep exited ${filter_status} while applying the OS-cfg allowlist."
              exit "$filter_status"
            fi
          fi
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::OS-conditional cfg is allowed only under crates/hekma-engine/src/backends/, the grandfathered legacy kt self-update files, the ENUMERATED engine test files (atomic_config_writes.rs, memory.rs), hekma-host's signals.rs (the host's shutdown-signal wait), hekma-host's control_api.rs (the secrets-file 0600 write), hekma-host's binary_flags.rs (the same 0600 write, the --log-capture binary leg), and hekma's serve_cli.rs (the same 0600 write, real-binary leg). A new cfg use in any other file must either go data-driven (OsId::current) or join this allowlist with a justification in the step comment."
            exit 1
          fi
          echo "OS-cfg gate green: hits only in the backends home / grandfathered legacy files / the two enumerated test suites / the host's signals.rs / the host's control_api.rs / the host's binary_flags.rs / the hekma serve_cli.rs secrets write."
      - name: Enforce single currency-formatting module (story 3-3, AD-8)
        shell: bash
        run: |
          set -euo pipefail
          # AD-8: exactly ONE module formats currency. Money becomes a `$X.XX` human
          # string ONLY in crates/hekma-engine/src/domain/cost.rs (render_dollars /
          # render_dollars_bare). Every other module passes Micros + EstimateLabel as
          # DATA; --json emits integer micros, never a `$` string. This gate FAILS if a
          # `$`-string-building form appears anywhere else.
          #
          # BROADENED alternation (a narrow `\$\{` missed several dollar-string shapes):
          #   \$ ?\{  — `${...}` AND `$ {...}` (a `$` glued to a format placeholder,
          #             with or without a space): format!("${x}") / "$ {}"
          #   \}\$    — `}$` (a placeholder immediately followed by a `$`): "{}$"
          #   "\$     — a string literal STARTING with `$`: "$", "$0.00", write!(f,"$")
          #   '\$'    — a bare `$` char literal: '$'
          pattern='\$ ?\{|\}\$|"\$|'\''\$'\'''
          # Allowlist (precise, not blanket-by-file): the ONE currency module (the
          # render home + its unit tests), PLUS the genuinely NON-currency `$` uses the
          # broadened pattern also matches —
          #   contains\(.\$  — `.contains('$')` / `.contains("$...` DISCIPLINE READ-checks
          #                    (they assert a `$` is absent/present on a surface; a read
          #                    never FORMATS currency, so it cannot hide a regression).
          #   \$PWD / \$KT_TEST — shell-variable interpolation in a spawned command
          #                    string (a process backend test), not a dollar figure.
          # No NEW currency formatting may appear anywhere else in the workspace.
          allowlist='^crates/hekma-engine/src/domain/cost\.rs:|contains\(.\$|\$PWD|\$KT_TEST'
          scan_status=0
          hits="$(grep -rn --include='*.rs' -E "$pattern" crates/)" || scan_status=$?
          if [ "$scan_status" -ge 2 ]; then
            echo "::error::grep exited ${scan_status} while scanning for currency formatting."
            exit "$scan_status"
          fi
          violations=''
          if [ -n "$hits" ]; then
            filter_status=0
            violations="$(printf '%s\n' "$hits" | grep -Ev "$allowlist")" || filter_status=$?
            if [ "$filter_status" -ge 2 ]; then
              echo "::error::grep exited ${filter_status} while applying the currency allowlist."
              exit "$filter_status"
            fi
          fi
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Currency formatting (a \`\$\`-string form: \`\${...}\`, \`\$ {}\`, \`{}\$\`, a \"\$\"-prefixed string, or a '\$' char) is allowed ONLY in crates/hekma-engine/src/domain/cost.rs (AD-8: one currency module). Pass Micros + EstimateLabel as data and render through render_dollars / render_dollars_bare."
            exit 1
          fi
          echo "Currency gate green: dollar formatting lives only in the one currency module."

  semver:
    name: semver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The armed in-repo baseline guard (#160, epic-6 retro A1; engine arm
          # in story 7-4) diffs TWO frozen surfaces against their freeze
          # commits: hekma-adapter-api against the contract-v1 freeze commit
          # 4119db3, and hekma-engine against the epic-12 surface-extension
          # freeze commit 49da96b (see the baseline comment below for why the
          # two SHAs differ, and for the freeze history). The default shallow
          # clone cannot resolve a historical rev, so this job fetches full
          # history for the baseline lookups.
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Resolve the cargo-semver-checks version (AI-3)
        id: semver_version
        run: |
          set -euo pipefail
          user_agent="hekma-ci-semver-gate (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}; CI semver gate)"
          # The cache key must name a CONTENT hash, never a constant (AI-3): it
          # carries the resolved cargo-semver-checks version so a toolchain
          # update gets a fresh key. Non-fatal on crates.io trouble — an
          # "unknown" suffix degrades to an unpinned key, never a red gate.
          version="$(curl --silent --show-error --user-agent "$user_agent" --max-time 30 --retry 3 "https://crates.io/api/v1/crates/cargo-semver-checks" | sed -n 's/.*"max_version":"\([^"]*\)".*/\1/p' || true)"
          # Guard the resolved value (AI-3 hardening): an error body, JSON
          # drift, or any non-triple must never reach a `cargo install
          # --version <garbage>` under set -e — degrade to "unknown" (presence
          # check) instead of a red gate.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || version=unknown
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-
      - name: Restore cargo-semver-checks binary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Persist the source-installed cargo-semver-checks so the armed gate
          # does not rebuild it (~10 min) on every fresh runner (AI-1). AI-3:
          # the key carries the resolved version AND the save below fires only
          # when an install actually ran — with the old constant key, a dormant
          # run (gate unpublished pre-7-4, so no install ever executed) froze an
          # entry without the binary under the ONE key the armed gate needed,
          # forcing a rebuild on every armed run.
          key: ${{ runner.os }}-cargo-semver-checks-bin-${{ steps.semver_version.outputs.version }}
          restore-keys: ${{ runner.os }}-cargo-semver-checks-bin-
          path: |
            ~/.cargo/bin
      - name: Check public API semver (hekma-engine, hekma-adapter-api)
        id: semver_check
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.semver_version.outputs.version }}"
          user_agent="hekma-ci-semver-gate (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}; CI semver gate)"
          # Install the binary UP FRONT: the armed in-repo baseline guards below
          # run on EVERY push, so the old "lazy install inside the armed
          # branch" dormancy no longer applies — the adapter-api and engine
          # surfaces are guarded in-repo even while the crates.io baselines
          # stay dormant until the held publish executes
          # (docs/release-process.md). Same +stable + --locked + version-pin +
          # unknown-degrade idiom as before (AI-3).
          if [ "$version" = "unknown" ]; then
            if ! command -v cargo-semver-checks >/dev/null 2>&1; then
              # --force: a cache restore can have left a binary the
              # probe cannot run; install must replace, not abort.
              cargo +stable install cargo-semver-checks --locked --force
              echo "installed=true" >> "$GITHUB_OUTPUT"
            else
              # Presence is not runnability: a cache-restored binary that
              # cannot execute would red the ARMED baseline run below on
              # infra, not on a surface break. Verify, replace if broken.
              cargo-semver-checks --version >/dev/null 2>&1 || {
                cargo +stable install cargo-semver-checks --locked --force
                echo "installed=true" >> "$GITHUB_OUTPUT"
              }
            fi
          else
            # Probe the binary DIRECTLY, never as `cargo cargo-semver-checks`:
            # that asks cargo for an external subcommand named
            # cargo-semver-checks, i.e. a binary called
            # cargo-cargo-semver-checks, which does not exist — the
            # probe read empty, the mismatch guard reinstalled over the
            # just-restored cache, and cargo install aborted (red gate
            # on every cache-hit run). `|| true` rescues set -o
            # pipefail when the binary is absent (a failed probe must
            # read "no cached version", never abort the job).
            cached="$(cargo-semver-checks --version 2>/dev/null | tail -n 1 | awk '{print $NF}' || true)"
            if [ "$cached" != "$version" ]; then
              cargo +stable install cargo-semver-checks --locked --force --version "$version"
              echo "installed=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          # ARMED in-repo baseline guards (#160, epic-6 retro A1; hekma-engine
          # armed in story 7-4): diff the FROZEN public surfaces against their
          # freeze commits. The guard fires on ANY breaking surface change vs
          # the baseline (removal, rename, signature) — whether or not it was
          # announced; announcement enforcement is review discipline until the
          # crates.io flow gives each crate a real release-to-release baseline
          # (the dormant per-crate crates.io loop below arms at first publish).
          #
          # TWO baselines, two honest freeze points:
          # * hekma-adapter-api @ 4119db3 — the contract-v1 freeze commit: the
          #   contract surface has been frozen since story 6-6.
          # * hekma-engine @ 1e71389 — the epic-14 merge (2026-09-22, PR
          #   #184): the latest deliberate post-freeze surface extension
          #   (`EngineError::DetachRefused` + `SpawnSpec.detach` — announced
          #   in the PR) defines the new freeze point. The prior extension
          #   was epic-11's `EngineError::ResumeUnsupported` (AI-7, bee7d48,
          #   PR #181), which superseded the EMBEDDING-surface freeze (armed
          #   at 7-3's 8a8b328, later pinned to 12f3aab per the
          #   main-history constraint below). That freeze was itself
          #   Deliberately-NOT-4119db3: the engine's surface was legitimately
          #   still growing when the contract froze (the freeze itself added
          #   the `LaunchResolveError::ContractIncompatible` variant to an
          #   engine error enum, and the lifecycle/events stories reshaped
          #   more) — the engine was `publish = false` throughout, so those
          #   were allowed evolution, and a 4119db3 baseline would red CI on
          #   that honest history. Same mechanism, same pins, same bump
          #   procedure.
          #
          # Maintenance: at the next deliberate freeze (a contract-v2 freeze
          # for adapter-api, or an announced engine major), update the SHAs
          # here — and their copies in scripts/test_automation.py — together.
          # The baseline builds resolve the freeze commit's OWN dependencies;
          # if one is ever yanked/deleted upstream, the guard reds on infra —
          # bump the SHA to a known-good commit rather than debugging the
          # gate. The cat-file checks below keep a history-rewrite/GC failure
          # a CLEAR error instead of a confusing semver-checks resolution
          # abort.
          #
          # EPIC-12 NOTE (resolved at merge): the epic-12 PR's announced
          # surface extension (`EngineError::DetachRefused` + the
          # `SpawnSpec.detach` field, story 12-1) red this gate against
          # bee7d48 exactly as predicted; the hekma-engine baseline has
          # been bumped to the epic-12 main-history merge commit 49da96b
          # (here AND in scripts/test_automation.py) — the same post-merge
          # step PR #181 did for its own extension.
          # RENAME-AWARE BASELINE STRATEGY (v0.8.0 Hekma migration): the two
          # freeze baselines predate the crate rename, so same-name baseline
          # diffing (`-p hekma-engine --baseline-rev <old>`) cannot resolve a
          # package that did not carry that name at the baseline rev — by
          # construction, not by drift. Until fresh baselines are pinned to the
          # migration's main-side merge commit (the SAME post-merge step PRs
          # #181/#184 took for their freeze bumps — BASELINE-REV CONSTRAINT:
          # this repo squash-merges, so the merge SHA exists only AFTER
          # landing; update the SHAs here AND in scripts/test_automation.py
          # together), the rename SURFACE CHECK holds the line: an external
          # consumer fixture compiles against BOTH the baseline rev's
          # old-named crate and HEAD's renamed crate. No compatibility claim
          # ever comes from a skipped check — either build failing reds this
          # job.
          bash scripts/rename_surface_check.sh \
            4119db37b5288b990144d28f995ee14a69271b5e \
            crates/hekma-adapter-api \
            ktesio-adapter-api hekma-adapter-api \
            fixtures/external-consumers/adapter-api-consumer/src/main.rs
          bash scripts/rename_surface_check.sh \
            49da96b6f1c695edd6afd379526deba42cf6da60 \
            crates/hekma-engine \
            ktesio-engine hekma-engine \
            fixtures/external-consumers/engine-consumer/src/main.rs

          # FRESH POST-RENAME BASELINES (pinned 2026-09-16, after the
          # hekma-* publishes, to 54dc79c — the PR #188 correction merge,
          # the first main-side rev carrying the hekma-* package names).
          # EPIC-14 NOTE (resolved 2026-09-22): both baselines bumped to
          # 1e71389 — the PR #193 epic-14 squash — for the announced
          # hekma-engine 0.4.0→0.5.0 extension (`EngineError::
          # AcpTurnInFlight` + `SpawnSpec.pipe_stdout`); the #181/#184
          # post-merge step. adapter-api's epic-14 diff was semver-clean
          # (doc comments only); its baseline rides the same rev.
          # Same-name baseline diffing works from here on; the rename
          # surface checks above stay as the old-vs-new compat guard.
          # BASELINE-REV CONSTRAINT: main-history revs only; bump here AND
          # in scripts/test_automation.py together at the next freeze.
          cargo +stable semver-checks check-release -p hekma-adapter-api --baseline-rev 1e713898f7b0b805dff83bd80e24febe99ca957f
          cargo +stable semver-checks check-release -p hekma-engine --baseline-rev 1e713898f7b0b805dff83bd80e24febe99ca957f
          for crate in hekma-engine hekma-adapter-api; do
            status="$(curl --silent --show-error --user-agent "$user_agent" --max-time 30 --retry 3 --output /dev/null --write-out "%{http_code}" "https://crates.io/api/v1/crates/${crate}")" || status=000
            case "$status" in
              200)
                # The binary was ensured above; the crates.io baseline (once
                # the held publish runs) is the authoritative
                # release-to-release gate — no version re-probe happens here.
                cargo +stable semver-checks check-release -p "$crate"
                ;;
              404)
                echo "::notice::${crate} has no published baseline on crates.io yet; the crates.io release-to-release gate arms at first publish (the HELD publish runbook, docs/release-process.md)."
                ;;
              000|429|5[0-9][0-9])
                echo "::notice::crates.io returned transient status ${status} for ${crate}; skipping the semver check this run."
                ;;
              *)
                echo "::error::Unexpected crates.io API status ${status} while checking ${crate}."
                exit 1
                ;;
            esac
          done

          # BOTH-GRAPH CONSUMER (arms at first hekma-engine publish): the
          # published ktesio-engine 0.3.0 and hekma-engine must resolve in
          # ONE external dependency graph (fixtures/external-consumers/
          # both-graph) — dependency aliases prove nothing, a real
          # two-dependency lockfile does.
          both_status="$(curl --silent --show-error --user-agent "$user_agent" --max-time 30 --retry 3 --output /dev/null --write-out "%{http_code}" "https://crates.io/api/v1/crates/hekma-engine")" || both_status=000
          case "$both_status" in
            200)
              (cd fixtures/external-consumers/both-graph \
                && cargo +stable build --quiet \
                && cargo +stable run --quiet)
              echo "both-graph consumer ok: ktesio-engine 0.3.0 + hekma-engine resolve together."
              ;;
            *)
              echo "::error::Unexpected crates.io API status ${both_status} for hekma-engine (both-graph probe)."
              exit 1
              ;;
          esac

          # DEPRECATION SHIM compile check (arms when the hekma-* libraries
          # are live): the three one-shot ktesio-* shims under deprecated/
          # must compile against the PUBLISHED hekma-* crates — their
          # re-exports are what keep old `use ktesio_*::…` paths working
          # after `cargo update`. Before those publishes their registry
          # dependencies cannot resolve (404 -> notice, armed at publish).
          shim_status="$(curl --silent --show-error --user-agent "$user_agent" --max-time 30 --retry 3 --output /dev/null --write-out "%{http_code}" "https://crates.io/api/v1/crates/hekma-engine")" || shim_status=000
          case "$shim_status" in
            200)
              for shim in deprecated/ktesio-engine deprecated/ktesio-adapter-api deprecated/ktesio-adapters-hermes; do
                cargo +stable check --quiet --manifest-path "${shim}/Cargo.toml"
              done
              echo "deprecation shims green against the published hekma-* crates."
              ;;
            404)
              echo "::notice::hekma-engine is not on crates.io yet; the deprecation-shim compile check arms at first publish."
              ;;
            000|429|5[0-9][0-9])
              echo "::notice::crates.io returned transient status ${shim_status}; skipping the deprecation-shim check this run."
              ;;
            *)
              echo "::error::Unexpected crates.io API status ${shim_status} for hekma-engine (shim probe)."
              exit 1
              ;;
          esac
      - name: Save cargo-semver-checks binary (only when an install ran)
        if: steps.semver_check.outputs.installed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # AI-3: the save is CONDITIONAL (an install actually ran) and keyed
          # on the resolved version — a dormant run can never freeze an empty
          # entry under a key the armed gate later restores.
          key: ${{ runner.os }}-cargo-semver-checks-bin-${{ steps.semver_version.outputs.version }}
          path: |
            ~/.cargo/bin

  audit:
    name: audit
    # Story 12-3: the supply-chain teeth for the new TLS dependency family
    # (hyper-rustls/rustls/webpki-roots/ring). `cargo audit` scans Cargo.lock
    # against the RustSec Advisory Database and FAILS the job on a known
    # vulnerability (a finding is either fixed or carries a documented,
    # reviewed waiver in audit.toml — an undocumented ignore is not an option).
    # Same conventions as the other tool installs in this file: SHA-pinned
    # checkout, source install via `cargo install --locked`, guarded by
    # `command -v` + a binary cache (AI-1/AI-23) so a fresh runner does not
    # rebuild the scanner every time.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Date-stamp the scanner cache key
        id: audit_key
        run: echo "stamp=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo-audit binary
        id: audit_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Persist the source-installed cargo-audit (~several minutes of
          # build) so scans stay cheap — but the key is DATE-STAMPED (review
          # loop 1, patch bundle): the constant key this replaces could freeze
          # a months-old scanner binary forever, because the `command -v`
          # guard skipped the install on every cache hit — the scheduled
          # re-scan ran, but the SCANNER never refreshed. Now a same-day run
          # hits the exact key (cheap, no rebuild), and the first run of each
          # new day misses it and forces a fresh install below, so the scanner
          # binary is at most ~1 day old when it reads the advisory database.
          key: ${{ runner.os }}-cargo-audit-bin-${{ steps.audit_key.outputs.stamp }}
          path: |
            ~/.cargo/bin
          restore-keys: ${{ runner.os }}-cargo-audit-bin-
      - name: Install cargo-audit
        # Install (or refresh) unless TODAY'S cache restored a WORKING binary:
        # a same-day exact-key hit with a runnable `cargo audit --version`
        # skips the rebuild; anything else — a new day (the date-stamped key
        # misses, so the scanner refreshes) or a CORRUPT/truncated cached
        # binary (review round 2: the version probe fails, so the cache
        # self-heals instead of failing the job) — rebuilds with `--force`
        # (cargo install otherwise refuses to overwrite a visible binary).
        run: |
          if [ "${{ steps.audit_cache.outputs.cache-hit }}" = "true" ] && cargo audit --version >/dev/null 2>&1; then
            echo "cargo-audit restored from today's cache and runnable; skipping the rebuild."
          else
            cargo +stable install cargo-audit --locked --force
          fi
          cargo audit --version
      - name: Scan the lockfile (RustSec advisories)
        # Non-interactive, machine-readable-ish summary. Fails (nonzero exit)
        # on any vulnerability finding → fix it or add a REVIEWED waiver to
        # audit.toml (with a reason + a tracking note); never an undocumented
        # ignore.
        run: cargo audit

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned MSRV toolchain
        # Floor set by the bundled-SQLite build: rusqlite 0.40.1 →
        # libsqlite3-sys 0.38.1 uses cfg_select!, stabilized in 1.96.1. Keep in
        # lockstep with rust-version in the root Cargo.toml [workspace.package].
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-msrv-
      - name: Check workspace builds on the MSRV
        # --all-targets (not just the lib graph) so the DEV-dependencies
        # compile on the pinned floor too: the story-7-5 perf harness carries
        # `sysinfo` as a benchmark-gated dev-dep, and a future sysinfo MSRV
        # bump past 1.96.1 must red HERE (on a lockfile refresh), not in a
        # contributor's local build.
        run: cargo +1.96.1 check --workspace --all-targets

  governance-vectors:
    name: governance-vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the vectors artifact checksum
        # The published `.sha256` names the repo-relative path, so this
        # verifies in place: the committed artifact IS the checksummed bytes.
        run: sha256sum -c crates/hekma-engine/governance/vectors-v1.json.sha256
      - name: Parse the vectors artifact (stand-in Host verification)
        # What a non-Rust Host does with the artifact: parse JSON, pin the
        # header, assert unique ids, both case kinds, and full rule coverage.
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          path = pathlib.Path("crates/hekma-engine/governance/vectors-v1.json")
          document = json.loads(path.read_text(encoding="utf-8"))
          assert document["artifact"] == "hekma-governance-vectors", document["artifact"]
          assert document["schema_version"] == 1, document["schema_version"]
          assert document["vectors_version"], "vectors_version must be set"
          kinds = {}
          tags = set()
          ids = set()
          for case in document["cases"]:
              kind = case["kind"]
              kinds[kind] = kinds.get(kind, 0) + 1
              assert case["id"] not in ids, f"duplicate case id {case['id']}"
              ids.add(case["id"])
              tags.update(case["covers"])
          expected = {
              "threshold-ge",
              "latch-per-scope",
              "latch-re-arm",
              "token-before-dollar",
              "integer-micros",
              "round-half-up",
              "saturation",
              "no-retro-repricing",
          }
          missing = expected - tags
          assert not missing, f"uncovered rules: {sorted(missing)}"
          assert kinds.get("decision"), f"no decision cases: {kinds}"
          assert kinds.get("derivation"), f"no derivation cases: {kinds}"
          print(
              "governance vectors ok:"
              f" {len(document['cases'])} cases {kinds},"
              f" {len(tags)} rules covered"
          )
          PY

  coverage:
    name: coverage
    # 2026-10-17 (#292): pinned to ubuntu-26.04 like the test matrix's linux
    # leg (the class-2 runner-freeze mitigation). Both coverage runs of
    # bc561ee on the 24.04 image died ~52 min into
    # Enforce coverage with "the hosted runner lost communication with the
    # server" — the x86-ubuntu wedge family starving the runner process itself,
    # not a test hang and not the AI-23 cold-compile shape (the instrumented
    # build had long finished; tarpaulin was mid-suite). The same PR's
    # test (ubuntu-26.04) legs were green twice, and the wedge-postmortem
    # artifact shows 26.04 carrying the same fake_agent leftovers with no
    # freeze — so the pin moves the last 24.04 consumer off the drifting
    # ubuntu-latest label (migrating Oct 19–Nov 19 anyway).
    runs-on: ubuntu-26.04
    needs: [fmt, clippy, test, build, docs, boundary, semver, governance-vectors]
    # 90: the FIRST run on a cold coverage cache must compile the ENTIRE dependency
    # graph WITH coverage instrumentation — a separate fingerprint from the other
    # jobs' normal-profile target, so nothing is reusable. That one-time cold build
    # (not the test run) is what repeatedly blew the 20- then 40-min caps (AI-23);
    # llvm did not help because the cost is compile, not execution. The dedicated
    # coverage cache below persists the instrumented target so every later run is
    # warm; 90 is generous headroom because coverage now runs tarpaulin ONCE PER
    # CRATE (5 sequential runs, #101) instead of one --workspace pass — the split
    # keeps each instrumented run's live process tree small enough to fit the 7 GB
    # runner, but the sum of the sequential runs is longer than a single pass.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo (coverage-specific)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # DEDICATED key — not the shared ${{ runner.os }}-cargo-<lock> the other
          # jobs use. Tarpaulin builds the whole graph with coverage instrumentation
          # (different rustflags → different fingerprints), so it can NEVER reuse the
          # other jobs' normal-profile target. Sharing the key also meant coverage
          # restored useless artifacts and — the key already existing when this job
          # (which `needs` the others) ran — never SAVED its own instrumented target,
          # so every run recompiled the graph cold and blew the timeout (AI-23). This
          # key persists the instrumented target; only the first run builds it cold.
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          restore-keys: ${{ runner.os }}-cargo-coverage-
      - name: Cache cargo-tarpaulin binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Persist the source-installed cargo-tarpaulin so coverage does not
          # rebuild it (~10 min) on every fresh runner (AI-23) — mirrors the
          # semver job's cargo-semver-checks-bin cache (AI-1). restore-keys lets a
          # partial-key match seed ~/.cargo/bin so a bumped exact key still warms
          # from the prior binary instead of a cold rebuild (AI-3: a constant key
          # can freeze an empty entry).
          key: ${{ runner.os }}-cargo-tarpaulin-bin
          path: |
            ~/.cargo/bin
          restore-keys: ${{ runner.os }}-cargo-tarpaulin-bin
      - name: Add llvm coverage tooling
        # --engine llvm (below) shells out to llvm-profdata / llvm-cov to merge the
        # profraw output; llvm-tools-preview provides them for the stable toolchain.
        run: rustup component add llvm-tools-preview
      - name: Install cargo-tarpaulin
        # Explicit +stable (see fmt job): coverage runs on latest stable; the root
        # rust-toolchain.toml pins only local bare cargo. Idempotent install: on a
        # cache hit the binary is already on PATH, so the `command -v` guard skips
        # the rebuild (matches the semver gate's guarded install, AI-23).
        run: command -v cargo-tarpaulin >/dev/null 2>&1 || cargo +stable install cargo-tarpaulin --locked
      - name: Install lcov (per-crate coverage merge, #101)
        # The per-crate split (#101) writes one LCOV tracefile per crate; lcov
        # merges them into the workspace-aggregate the --fail-under 95 gate is
        # enforced on. apt's lcov is enough — only `lcov -a`/`--summary` are used.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lcov
      - name: Reclaim disk + add swap for the instrumented run
        # The instrumented build is far heavier than the normal `test` job (coverage
        # counters + the fleet/adoption tests each spawning several instrumented
        # children), and the runner "lost communication" ~49 min in — an OOM that
        # drops the job with no log (AI-23). Two pressures, addressed together:
        #   * DISK — the instrumented target + profraw sit on `/` (~14 GB free); an
        #     earlier swap file on /mnt did NOT relieve `/`. Free the big unused
        #     preinstalled SDKs (~30 GB) so the instrumented target has room.
        #   * RAM — an 8 GB swap file on the roomy /mnt temp disk lets a spike page
        #     instead of OOM-ing. (CARGO_PROFILE_DEV_DEBUG=1 below also shrinks the
        #     instrumented binaries, cutting both RAM and `/` disk — coverage same.)
        run: |
          set -euo pipefail
          echo "before:"; df -h / /mnt; free -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo fallocate -l 8G /mnt/covswap
          sudo chmod 600 /mnt/covswap
          sudo mkswap /mnt/covswap
          sudo swapon /mnt/covswap
          echo "after:"; df -h / /mnt; free -h
      - name: Enforce coverage (per-crate split + merged aggregate gate, #101)
        # NOTE for future env additions: RUST_BACKTRACE rode this step's env
        # block 2026-09-26/27 to pin the llvm_profparser partial-profraw
        # panic; it is GONE now (root-caused — see the fake_acp_agent guard
        # below). Adding a SECOND `env:` key on one step is a duplicate
        # mapping key: GitHub does not deduplicate the way PyYAML does, and
        # the workflow STARTUP-FAILS with zero jobs, taking every required
        # check down with it (#238/#239).
        # WHY the split (#101): a single `cargo tarpaulin --workspace` instruments
        # the ENTIRE graph (tokio + bundled-SQLite C + a 13-crate hyper stack) and
        # runs all ~1075 tests instrumented; even after the AI-23 fixes (dedicated
        # cache, --engine llvm, serial tests, 8 GB swap, disk reclaim, line-tables
        # debuginfo) the instrumented run's live process tree still OOM'd the 7 GB
        # runner ("runner lost communication", no log). Running tarpaulin ONCE PER
        # CRATE (`-p <crate>`) keeps each run's resident set small enough to fit.
        #
        # CORRECTNESS (de-risked locally before this landed): tarpaulin reports
        # coverage for ALL workspace source each built test binary touches, NOT just
        # the `-p` crate's own source — so a hekma-engine line covered only by a
        # `hekma` CLI test IS credited under `-p hekma`. The UNION of the five
        # per-crate tracefiles therefore reproduces the --workspace result exactly:
        # locally the merged aggregate is 95.22% (5718/6005), identical to
        # --workspace to the line (0 lines lost, 0 gained). No report-scope flag is
        # needed; the merge just needs `lcov --ignore-errors inconsistent` because
        # lcov 2.x rejects the benign FN-start-line drift tarpaulin emits across
        # runs (function metadata only — it does not touch DA/LF/LH line data).
        #
        # ORDER: lightest → heaviest, hekma-engine LAST. If the heavy crate still
        # OOMs the runner, the lighter crates' tracefiles + per-crate numbers are
        # already printed, so a per-crate OOM is diagnosable (which crate, at what
        # `free`/`df`) instead of one opaque --workspace failure.
        #
        # Flags unchanged from the --workspace gate: --engine llvm (parity with
        # the local macOS gate, see docs/testing.md), --skip-clean (reuse the cached
        # instrumented target), --timeout "$tarp_timeout" (a per-crate budget —
        # see the case arm in the loop below — raising tarpaulin's 60 s
        # per-test-binary cap),
        # --verbose (progress). Env unchanged (AI-23): RUST_TEST_THREADS=1 runs the
        # instrumented tests serially; CARGO_PROFILE_DEV_DEBUG=1 builds line-tables-
        # only debuginfo (smaller instrumented binaries, coverage unchanged). The
        # merged aggregate replaces tarpaulin's per-run --fail-under 95 with the SAME
        # workspace >= 95 gate enforced on the union (a per-crate --fail-under would
        # wrongly fail the lighter crates, which see only part of the workspace).
        env:
          RUST_TEST_THREADS: "1"
          CARGO_PROFILE_DEV_DEBUG: "1"
        shell: bash
        run: |
          set -euo pipefail
          # STALE `fake_agent` GUARD -- the ROOT CAUSE of this job's long red
          # streak, and the SAME defect class already fixed in the `test` job (see
          # its "Build test binaries" step, which carries the fuller write-up).
          # This job's `target/` cache key is derived from
          # `hashFiles('**/Cargo.lock')`, so a change touching ONLY the
          # `fake_agent` test helper CANNOT bust it: the entry stays frozen at
          # whatever helper was built the last time Cargo.lock moved, which here
          # predated the `--echo-stdin` / `--heartbeat-stderr-ms` flags.
          # `fake_agent`'s arg parser ignores unknown args (`_ => {}`), so the
          # stale binary silently never echoes stdin and never writes stderr, and
          # the tests then wait out their deadlines for output that can never
          # arrive -- surfacing as deadline-miss asserts ("never observed ... in
          # agent.log" / "echoed stdin line never appeared") that LOOK like slow
          # IO but are a missing feature. Compounding it: tarpaulin compiles the
          # helper only as a `--test` artifact and never uplifts it to
          # target/debug/fake_agent, while `hekma_conformance::fake_agent_bin()`
          # accepts that path when the file merely EXISTS (no freshness check) --
          # so the frozen copy is exactly what every spawning test runs.
          #
          # Proven, not inferred: swapping the pre-6afac99 helper in locally
          # reproduces the exact CI assertion with NO instrumentation at all,
          # while a freshly built helper passes under real tarpaulin in 0.35s.
          # Instrumentation latency was NOT the cause.
          #
          # `rm` + an EXPLICIT build (not just `rm`) for the same reason the test
          # job needs both: nothing in the tarpaulin path ever places that
          # top-level hardlink, so without the build the spawning tests would race
          # on the lib's on-demand `cargo build` fallback (concurrent cargo
          # invocations contend on the build-dir lock -- an observed flake). The
          # plain profile also keeps the helper OUT of the coverage denominator,
          # which is the documented posture (docs/testing.md: `fake_agent` runs
          # only as a spawned subprocess and is excluded from coverage).
          rm -f target/debug/fake_agent target/debug/fake_agent.exe
          rm -f target/debug/hermes_shim target/debug/hermes_shim.exe
          cargo +stable build -p hekma-conformance --bin fake_agent
          # hermes_shim: same freshness + lock-contention rationale as
          # fake_agent above (review-of-6-2, vg-o1) — its locator also accepts
          # a merely-EXISTING target/debug/hermes_shim.
          cargo +stable build -p hekma-conformance --bin hermes_shim
          # fake_acp_agent: ONE of TWO sources of the llvm_profparser panic
          # that killed this job through 2026-09-27 ("parser failure:
          # Nom(Eof)" / "llvm_profparsers works on complete data", diagnosed
          # 2026-09-26, backtrace pinned to parse_bytes on 2026-09-27). This
          # job pre-built fake_agent and hermes_shim plain, but NOT
          # fake_acp_agent — so the acp_lifecycle suite's locator fell to the
          # ON-DEMAND build, which inherits the ambient instrumented
          # RUSTFLAGS from tarpaulin. Every spawned ACP child was therefore
          # instrumented; the stop ladder's SIGKILL rung left a PARTIAL
          # profraw per killed child; the merge parse hit it and panicked.
          # The explicit PLAIN build below puts an UNINSTRUMENTED helper at
          # target/debug/fake_acp_agent BEFORE the tarpaulin runs:
          # tarpaulin compiles the bin only as a --test artifact and never
          # uplifts it to that path, so the plain copy survives and spawned
          # children write NO profraws at all. (The bin stays excluded from
          # the coverage denominator via --exclude-files — the documented
          # helper posture, docs/testing.md — so plain vs instrumented is
          # gate-neutral.) Freshness guard for the same Cargo.lock-keyed
          # cache reason as fake_agent above.
          # The SECOND source was the re-exec'd HELPER SUBPROCESSES of the
          # crash-shape suites (adoption/acp_lifecycle/interaction/logs/
          # agent_cli): the helper IS the instrumented test binary, and a
          # profraw of its writing ends up in the binary's merge set — where
          # it parsed as INCOMPLETE on a loaded runner (run-to-run flip on
          # the same SHA, 2026-09-28). An explicit in-helper profile write
          # BEFORE its forced exit did NOT stop the panic (the next push
          # still lost an attempt) — so the fix is at the SPAWN: every
          # re-exec site redirects LLVM_PROFILE_FILE to a scratch path via
          # hekma_conformance::helper_profile_env() (the runtime reads the
          # path at INIT, so the parent must set it), and the helper's
          # profraw never enters the merge set at all. DETERMINISTIC.
          # RESIDUAL (surfaced, not silent): two SIGKILL channels cannot
          # pre-write their profile — agent_cli.rs's hung-CLI harness kill
          # and acp_lifecycle.rs's real-agent probe kill. Both fire only on
          # a timeout that a healthy run never hits; if a future panic
          # points at one of those files, revisit the kill paths, not the
          # merge.
          rm -f target/debug/fake_acp_agent target/debug/fake_acp_agent.exe
          cargo +stable build -p hekma-conformance --bin fake_acp_agent
          # NO RETRY WRAPPER for the STALE-HELPER failure: that failure (the
          # guard above) is DETERMINISTIC — a stale binary re-fails every
          # attempt, so retrying could never converge. It stays removed.
          # The tarpaulin invocations below DO carry a bounded per-crate
          # retry (see the loop) for the SEPARATE llvm_profparser panic
          # family — a proven same-SHA flip (2026-09-28, #239), where a
          # bounded retry converges.
          rm -rf cov && mkdir -p cov
          # Crate list as positional params (portable, no word-split reliance):
          # lightest → heaviest, hekma-engine LAST (see the WHY comment above).
          # hekma-host (story 17-2) rides before the engines: its lib is
          # small (lock/drain/signals/serve), and its tests spawn REAL
          # agents — coverage must include it (the ≥95% gate is aggregate).
          set -- hekma-adapter-api hekma-conformance hekma-adapters-hermes hekma-host hekma hekma-engine
          # The conformance test-support BINS (fake_agent, fake_acp_agent,
          # hermes_shim) and the engine's EXAMPLE targets (perf-budgets, the
          # committed-baseline ratchet harness the perf-budgets job builds
          # --release and RUNS under its own gate; embedding-quickstart, the
          # docs artifact the build job smoke-runs) are excluded from
          # instrumentation: their lines are exercised by the lanes that own
          # them, never by a unit test, so counting them in the unit-coverage
          # denominator is cross-lane noise (the same documented posture as
          # the helpers, docs/testing.md). This exclusion is the REPORT-side
          # defense; the PANIC-side defenses are the explicit plain build of
          # all three helpers above (a killed instrumented child leaves a
          # PARTIAL profraw that crashes llvm_profparser at the merge) AND
          # the test crates' exit_helper_subprocess (the re-exec'd helper's
          # own profile write; root-caused 2026-09-28 — see the
          # fake_acp_agent guard).
          for pkg in "$@"; do
            echo "::group::tarpaulin -p $pkg"
            echo "--- resources before $pkg ---"
            free -h || true
            df -h / || true
            # Per-crate tarpaulin budget (#334): --timeout is tarpaulin's
            # PER-TEST-BINARY cap, and the flat 180 s held every crate until
            # the epic-18 engine suites landed — exit_codes/drain/liveness/
            # readiness are wall-clock-bound (real stability windows, restart
            # ladders, sleeps) and run SERIALLY (RUST_TEST_THREADS=1), so the
            # exit_codes binary alone needs >180 s under llvm instrumentation.
            # Observed: killed at exactly 180 s mid-suite, deterministically,
            # on 8/8 attempts across two stacked PRs — a wall-clock overrun
            # the 4-attempt retry loop below can never converge. The engine
            # gets 420 s (≈2× the observed need); every other crate keeps the
            # 180 s default. Bounded either way: a genuinely hung engine
            # binary still fails in 4 × 420 s = 28 min worst case, inside the
            # 90-min job wall.
            case "$pkg" in
              hekma-engine) tarp_timeout=420 ;;
              *) tarp_timeout=180 ;;
            esac
            # Bounded per-crate retry (2026-09-28, #239): the llvm_profparser
            # merge intermittently dies on "llvm_profparsers works on complete
            # data" — a same-SHA run-to-run flip, so this converges. Each
            # attempt starts with a CLEAN profraw set: tarpaulin's merge walks
            # the WHOLE directory (minus pre-existing files), so a prior
            # attempt's partial file would poison every later merge. Earlier
            # crates' tracefiles are already safe in cov/. The root-cause loop
            # stays open: panics ship the profraws in the diagnostics
            # artifact below.
            attempt=1
            while true; do
              rm -rf target/tarpaulin/profraws
              # Re-assert the PLAIN helpers before EVERY attempt. Evidence
              # (2026-09-29, the #239 diagnostics artifact): on CI the
              # helpers are INSTRUMENTED by the time the spawning suites run
              # — tarpaulin's own builds of the conformance package's bins
              # during the job leave uplifted instrumented copies at
              # target/debug/fake_* (the artifact census: 13 hekma_engine-
              # prefixed profraws, 3040-byte child profiles, multi-pid
              # families in every spawning suite — versus exactly ONE file
              # per binary on a local run). An instrumented agent spawned by
              # the ENGINE inherits the TEST's LLVM_PROFILE_FILE (the
              # spawn-time redirect only covers the test-binary re-execs),
              # writes into the merge set, and the stop ladder's SIGKILL
              # leaves it partial. The top-of-job guard above is therefore
              # NOT enough; every attempt re-asserts plain helpers. Their
              # own coverage stays excluded (--exclude-files, docs/testing.md
              # posture), so plain vs instrumented is gate-neutral.
              rm -f target/debug/fake_agent target/debug/fake_agent.exe
              rm -f target/debug/hermes_shim target/debug/hermes_shim.exe
              rm -f target/debug/fake_acp_agent target/debug/fake_acp_agent.exe
              cargo +stable build -p hekma-conformance --bin fake_agent \
                --bin hermes_shim --bin fake_acp_agent
              if cargo +stable tarpaulin --engine llvm --skip-clean --timeout "$tarp_timeout" --verbose \
                  --exclude-files 'crates/hekma-conformance/src/bin/*' \
                  --exclude-files 'crates/hekma-engine/examples/*' \
                  -p "$pkg" --out Lcov --output-dir "cov/$pkg"; then
                break
              elif [ "$attempt" -lt 4 ]; then
                attempt=$((attempt + 1))
                echo "::warning::tarpaulin -p $pkg failed (attempt $((attempt - 1))/4) — retrying with a clean profraw set"
              else
                echo "::error::tarpaulin -p $pkg failed on all 4 attempts"
                exit 1
              fi
            done
            echo "::endgroup::"
          done
          # Merge the per-crate tracefiles into the workspace aggregate. The
          # `hermes` crate is a tiny mapping-only lib (no coverable logic of its
          # own) -- it may legitimately produce no lcov.info; it is the ONLY crate
          # allowed to skip the merge with no lcov.info. --ignore-errors
          # inconsistent: tolerate lcov 2.x's benign cross-run FN-start-line drift
          # (line data is unaffected).
          #
          # PR #117 fix pass: this used to skip ANY crate with no lcov.info, not
          # just hermes. That silently swallowed a real failure mode -- when a
          # crate's OWN tarpaulin run fails (e.g. hekma-engine hitting one of this
          # job's real-IO tests), it produces no lcov.info too, and the old
          # code merged the aggregate from whatever crates DID succeed anyway. The
          # resulting gate failure ("merged coverage NN% is below 95%") read like a
          # genuine coverage shortfall across the whole workspace, when the real
          # story was "hekma-engine's measurement is entirely missing, so the
          # smaller remaining slice can't possibly clear a 95% bar sized for the
          # full workspace" -- confusing, and it silently accepted a
          # SUBSET-OF-THE-WORKSPACE gate as if it were the real one. Any crate
          # OTHER than the known doc-only stub missing its lcov.info now fails the
          # gate LOUDLY and immediately, before the misleading percentage math
          # ever runs.
          add_args=""
          for pkg in "$@"; do
            if [ -s "cov/$pkg/lcov.info" ]; then
              add_args="$add_args -a cov/$pkg/lcov.info"
            elif [ "$pkg" = "hekma-adapters-hermes" ]; then
              echo "::notice::no coverable lines for $pkg (expected for the mapping-only hermes lib); skipping in merge."
            else
              echo "::error::$pkg produced no lcov.info -- its tarpaulin run above almost certainly failed (a crashed/failed test suite, not a legitimately-empty crate). Failing the coverage gate rather than silently merging a partial, misleading aggregate."
              exit 1
            fi
          done
          echo "::group::merge tracefiles"
          # shellcheck disable=SC2086
          lcov $add_args -o cov/merged.info --ignore-errors inconsistent,inconsistent
          echo "::endgroup::"
          # Enforce the SAME workspace >= 95 gate on the MERGED aggregate. Parse the
          # `(<hit> of <found> lines)` FRACTION from `lcov --summary` (version-stable
          # across lcov 1.x/2.x) and compute the exact percentage — more robust than
          # the 1-decimal rounded `NN.N%` near the boundary. `lines_pair` is the two
          # integers "<hit> <found>"; a single awk both extracts and decides, so
          # there is no heredoc / read indentation fragility.
          echo "::group::merged coverage summary"
          lcov --summary cov/merged.info --ignore-errors inconsistent 2>&1 | tee cov/summary.txt
          echo "::endgroup::"
          # The gate number MUST survive a failed job: the step LOG blob for a
          # failed step can truncate (observed 2026-09-28 — the merged number
          # was unrecoverable from the #239 gate failure). The step SUMMARY is
          # a separate surface that does not truncate, and the per-crate lines
          # make a local-vs-CI gap attributable to a specific crate.
          {
            echo "## Coverage gate (per-crate split, #101)"
            echo '```'
            cat cov/summary.txt
            for pkg in "$@"; do
              if [ -s "cov/$pkg/lcov.info" ]; then
                echo "$pkg: $(lcov --summary "cov/$pkg/lcov.info" --ignore-errors inconsistent 2>&1 | grep -E 'lines\.\.\.' | sed 's/^ *//')"
              fi
            done
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          lines_pair="$(grep -E '^[[:space:]]*lines[.]*:' cov/summary.txt \
            | sed -E 's/.*\(([0-9]+) of ([0-9]+) lines\).*/\1 \2/' | head -1)"
          hit="${lines_pair%% *}"
          found="${lines_pair##* }"
          if [ -z "${found:-}" ] || ! [ "${found}" -gt 0 ] 2>/dev/null; then
            echo "::error::Could not parse merged line coverage from lcov --summary; aborting the coverage gate (#101)."
            exit 1
          fi
          pct="$(awk -v h="$hit" -v f="$found" 'BEGIN { printf "%.4f", (h / f) * 100 }')"
          echo "Merged workspace coverage: ${pct}% (${hit}/${found} lines) across the per-crate split (#101)."
          if awk -v p="$pct" 'BEGIN { exit (p + 0 >= 95) ? 0 : 1 }'; then
            echo "Coverage gate green: merged ${pct}% >= 95% on the per-crate union (#101)."
          else
            echo "::error::Merged workspace coverage ${pct}% (${hit}/${found} lines) is below the 95% gate (#101 per-crate split + lcov merge)."
            exit 1
          fi
      - name: Upload the coverage measurement (diagnostics)
        # ALWAYS — a gate failure ships its own evidence: merged.info carries
        # the per-line DA records, so a CI-vs-local uncovered gap is diffable
        # instead of guessed at (the failed-step log blob truncates; observed
        # 2026-09-28, #239). The PROFRAWS ride along for the llvm_profparser
        # panic family: a panic job's directory holds the partial file(s)
        # themselves — header-declared size vs actual bytes answers WHO wrote
        # an incomplete profile, which the logs cannot (the panicking job's
        # runner discards them otherwise).
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-measurement
          path: |
            cov/merged.info
            cov/summary.txt
            target/tarpaulin/profraws/
          retention-days: 7
          if-no-files-found: ignore
