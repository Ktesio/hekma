name: Docs Probe

# epic-7-retro-item-2 (story 11-5): the docs site (deployed by Cloudflare
# Pages OUTSIDE this repo's CI) once silently died for ~2 weeks — four
# pages 404'd from Aug 26 to Sep 9, 2026 while every repo CI check stayed
# green, because nothing WATCHED the deployed site. This workflow is that
# watcher: a scheduled probe that curls every registered docs page and
# fails, naming the dead page, when any of them stops serving.
#
# v0.8.0 Hemaka rename: the probe now checks TWO surfaces separately —
#   1. CANONICAL content at hemaka.ktesio.dev (every registered page must
#      answer HTTP 200);
#   2. LEGACY redirects: every docs.ktesio.dev page must answer 3xx with
#      a Location pointing at the canonical host (a 200 from the legacy
#      host means the redirect is MISSING; a 404 means it broke).
# Cutover note: the canonical host serves only after the (gated, outside-
# repo-CI) Cloudflare deploy; between landing this workflow and that
# deploy the probe is EXPECTED red on the canonical leg — run the hosting
# cutover in the same session as the release (migration spec §6.6).
#
# Deliberately a SEPARATE workflow with no `needs:` coupling and no
# dependency on the CI job graph: the probe must run (and fail) even when
# CI itself is red or skipped, and CI must never be gated on the site's
# health.

on:
  schedule:
    # Daily at 06:03 UTC — hours off the CI nightly (07:17 UTC) so a docs
    # regression is caught daily and the two scheduled runs never queue
    # together at a top-of-hour boundary.
    - cron: "3 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe hemaka.ktesio.dev + legacy redirects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Probe every registered docs page for HTTP 200 (canonical host)
        # The page list is the SITE's own registry, read from docs/meta.json at
        # probe time (not a hand-copied list that can drift): every entry that
        # is a real page (the `---…---` entries are section SEPARATORS, not
        # pages) must answer HTTP 200 at https://hemaka.ktesio.dev/<page>.
        #
        # URL mapping: docs/meta.json names SOURCE files; two special cases
        # get non-obvious URLs, mapped by docs/lib/source.ts's `slugs()` —
        #   * `README` is the site ROOT (`/`), not `/README`;
        #   * `RELEASE_NOTES` serves at `/release-notes`.
        # Those two mappings MUST be updated together with docs/lib/source.ts.
        #
        # Every failure is RECORDED and named (never fail-fast on the first
        # dead page — one run must report the whole blast radius, which is
        # exactly what the Aug 2026 incident needed). The step (and the job)
        # fails if ANY page is not a 200.
        shell: bash
        run: |
          set -euo pipefail
          base="https://hemaka.ktesio.dev"
          dead=0
          pages="$(jq -r '.pages[] | select(startswith("---") | not)' docs/meta.json)"
          if [ -z "$pages" ]; then
            echo "::error::docs/meta.json yielded no pages — the registry read is broken or the separators changed shape."
            exit 1
          fi
          while IFS= read -r page; do
            case "$page" in
              README) url="$base/" ;;
              RELEASE_NOTES) url="$base/release-notes" ;;
              *) url="$base/$page" ;;
            esac
            code="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 30 "$url")" || code=000
            if [ "$code" = "200" ]; then
              echo "ok   $url"
            else
              echo "::error::hemaka.ktesio.dev page is DOWN: $url answered HTTP $code (expected 200). The Cloudflare Pages deploy is stale or the page was removed — redeploy the docs site (or restore the page)."
              dead=$((dead + 1))
            fi
          done <<< "$pages"
          if [ "$dead" -gt 0 ]; then
            echo "::error::$dead of $(printf '%s\n' "$pages" | wc -l | tr -d ' ') registered docs pages are not serving HTTP 200 on the canonical host."
            exit 1
          fi
          echo "Canonical probe green: every registered page serves HTTP 200."

      - name: Probe every legacy docs.ktesio.dev page for a redirect (3xx to canonical)
        # A 200 from the LEGACY host is a FAILURE here: it means the redirect
        # to the canonical host is missing and two live copies can drift
        # apart (the exact split-brain the Aug 2026 incident made possible).
        # The Location header must name the canonical host.
        shell: bash
        run: |
          set -euo pipefail
          legacy="https://docs.ktesio.dev"
          canonical="https://hemaka.ktesio.dev"
          bad=0
          pages="$(jq -r '.pages[] | select(startswith("---") | not)' docs/meta.json)"
          while IFS= read -r page; do
            case "$page" in
              README) url="$legacy/" ;;
              RELEASE_NOTES) url="$legacy/release-notes" ;;
              *) url="$legacy/$page" ;;
            esac
            headers="$(curl --silent --show-error --max-time 30 -o /dev/null -D - "$url")" || headers=""
            code="$(printf '%s\n' "$headers" | head -1 | grep -oE '[0-9]{3}' || printf '000')"
            location="$(printf '%s\n' "$headers" | tr -d '\r' | sed -n 's/^[Ll]ocation: //p' | head -1)"
            if [ "${code:0:1}" = "3" ] && printf '%s' "$location" | grep -q "$canonical"; then
              echo "ok   $url -> $location"
            else
              echo "::error::legacy page $url answered HTTP $code (Location: ${location:-<none>}) — expected a 3xx redirect to $canonical. A 200 here means the redirect is MISSING (split-brain risk); a 404/5xx means it broke."
              bad=$((bad + 1))
            fi
          done <<< "$pages"
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad legacy docs.ktesio.dev pages do not redirect to the canonical host."
            exit 1
          fi
          echo "Legacy redirect probe green: every legacy page 3xx-redirects to $canonical."

      - name: Assert the newest page serves real content (not an empty 200)
        # A 200 alone cannot distinguish the real page from a CDN/edge error
        # page that happens to answer 200, so the NEWEST registered page (the
        # last entry in docs/meta.json — RELEASE_NOTES, served at
        # /release-notes) must also carry its content marker: the page's own
        # `<title>`/h1 text. A structurally-200-but-contentless deploy fails
        # here. Update the marker together with the page's title (or when the
        # newest entry in docs/meta.json changes).
        shell: bash
        run: |
          set -euo pipefail
          url="https://hemaka.ktesio.dev/release-notes"
          marker="Release Notes"
          body="$(curl --silent --show-error --max-time 30 "$url")" || body=""
          if printf '%s' "$body" | grep -q "$marker"; then
            echo "ok   $url carries the content marker \"$marker\"."
          else
            echo "::error::$url answered without the \"$marker\" content marker — the page is 200 but its content is wrong/empty (stale or broken deploy)."
            exit 1
          fi
