name: Docs Probe

# Watches the deployed docs site, hekma.ktesio.dev, which Cloudflare Pages
# builds from the ktesio.dev repository, outside this repository's CI. A
# deploy can die while every check here stays green (four pages answered 404
# for two weeks in August 2026), so this scheduled probe fetches the live site
# and fails, naming each broken page.
#
# Since 2026-10-23 the page list comes from the site's own sitemap.xml, which
# the site generates from its pages on every build. The docs no longer live
# in this repository, so docs/meta.json no longer describes the site; reading
# the sitemap means a page the site adds or removes needs no change here.
#
# Deliberately a separate workflow with no job dependency on CI: the probe
# must run (and fail) even when CI is red or skipped, and CI must never be
# gated on the site's health.

on:
  schedule:
    # Daily at 06:03 UTC, hours away from the CI nightly (07:17 UTC).
    - cron: "3 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe hekma.ktesio.dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe every page in the site's sitemap for HTTP 200
        # Every <loc> in https://hekma.ktesio.dev/sitemap.xml must answer 200.
        # A sitemap that cannot be fetched, or that lists too few /docs/ pages,
        # is itself a failure: the probe never passes on an empty list. Every
        # failure is recorded and named (no fail-fast), so one run reports the
        # whole blast radius.
        shell: bash
        run: |
          set -euo pipefail
          site="https://hekma.ktesio.dev"
          sitemap="$(curl --silent --show-error --fail --max-time 30 "$site/sitemap.xml")" || {
            echo "::error::$site/sitemap.xml could not be fetched — the deploy is down or the sitemap is gone."
            exit 1
          }
          pages="$(grep -o '<loc>[^<]*</loc>' <<<"$sitemap" | sed -e 's#<loc>##' -e 's#</loc>##')" || pages=""
          docs_count="$(grep -c "^$site/docs/" <<<"$pages" || true)"
          if [ "$docs_count" -lt 10 ]; then
            echo "::error::$site/sitemap.xml lists $docs_count /docs/ pages (expected at least 10) — the sitemap is broken or the docs are missing."
            exit 1
          fi
          dead=0
          while IFS= read -r url; do
            case "$url" in
              "$site"/*) ;;
              *)
                echo "::error::sitemap entry $url is not on $site — the site's base_url is wrong."
                dead=$((dead + 1))
                continue
                ;;
            esac
            code="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 30 "$url")" || code=000
            if [ "$code" = "200" ]; then
              echo "ok   $url"
            else
              echo "::error::hekma.ktesio.dev page is DOWN: $url answered HTTP $code (expected 200). The Cloudflare Pages deploy is stale or the page was removed — redeploy the site (or restore the page)."
              dead=$((dead + 1))
            fi
          done <<< "$pages"
          total="$(wc -l <<<"$pages" | tr -d ' ')"
          if [ "$dead" -gt 0 ]; then
            echo "::error::$dead of $total sitemap pages are not serving HTTP 200."
            exit 1
          fi
          echo "Sitemap probe green: all $total pages ($docs_count under /docs/) serve HTTP 200."

      - name: Check the landing page and the docs home carry their titles
        # A 200 alone cannot tell the real page from an edge error page, so
        # two pages must also carry their own <title>. Keep the markers in
        # step with the site's titles.
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          check() {
            url="$1"; marker="$2"
            body="$(curl --silent --show-error --max-time 30 "$url")" || body=""
            # A herestring, not a pipe: grep -q exits on the first match, and
            # under pipefail a SIGPIPE'd writer would turn a match into a failure.
            if grep -qF "$marker" <<<"$body"; then
              echo "ok   $url carries $marker"
            else
              echo "::error::$url is missing $marker — the deploy is wrong, or the title changed without this probe (update them together)."
              failed=1
            fi
          }
          check "https://hekma.ktesio.dev/" "<title>Hekma: run AI agents like services</title>"
          check "https://hekma.ktesio.dev/docs/" "<title>Hekma docs</title>"
          # The adapter gallery is a README-facing public URL (the README
          # links it) — the probe pins it so a missing/lagged site port
          # fails BY NAME instead of shipping dead README links green.
          check "https://hekma.ktesio.dev/docs/adapters/" "<title>Adapter Gallery</title>"
          # The telemetry page is the OTLP exposition's public URL (the
          # README links it) — pinned like the gallery above. The marker is
          # the page-title PREFIX the deployed page carries (the full title
          # is "Telemetry export (OTLP) — Hekma docs"); it goes live with
          # the ktesio.dev docs port (ktesio.dev PR #31) — until that port
          # deploys, this check fails by name rather than shipping a dead
          # README telemetry link green.
          check "https://hekma.ktesio.dev/docs/telemetry/" "<title>Telemetry export (OTLP)"
          exit "$failed"

      - name: Check the legacy URLs still redirect
        # These URLs are baked into published GitHub release bodies, the
        # deprecated ktesio-* crates' READMEs and old bookmarks, so each must
        # keep answering 301 with exactly this Location. The list is fixed on
        # purpose: it records what was published (the site's static/_redirects
        # is the other half). The maintainer pages moved back to this
        # repository on 2026-10-22, so their old URLs point at GitHub.
        shell: bash
        run: |
          set -euo pipefail
          site="https://hekma.ktesio.dev"
          mount="$site/docs"
          repo_docs="https://github.com/Ktesio/hekma/blob/main/docs"
          dead=0
          while read -r flat want; do
            [ -z "$flat" ] && continue
            got="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code} %{redirect_url}' --max-time 30 "$site$flat")" || got="000 "
            code="${got%% *}"
            loc="${got#* }"
            if [ "$code" = "301" ] && [ "$loc" = "$want" ]; then
              echo "ok   $site$flat -> 301 $want"
            else
              echo "::error::legacy URL broke: $site$flat answered \"$got\" (expected 301 with Location $want). Published links now dangle — restore the redirect in the site's static/_redirects."
              dead=$((dead + 1))
            fi
          done <<EOF
          /get-started $mount/get-started/
          /installation $mount/installation/
          /migration $mount/migration/
          /troubleshooting $mount/troubleshooting/
          /commands $mount/commands/
          /manifest $mount/manifest/
          /adapter-contract $mount/adapter-contract/
          /agents $mount/agents/
          /embedding $mount/embedding/
          /architecture $mount/architecture/
          /contributing $mount/contributing/
          /release-notes $mount/release-notes/
          /design/metering-agents-you-dont-control $mount/design/metering-agents-you-dont-control/
          /testing $repo_docs/testing.md
          /release-process $repo_docs/release-process.md
          /github-repository-audit-checklist $repo_docs/github-repository-audit-checklist.md
          /docs/testing $repo_docs/testing.md
          /docs/release-process $repo_docs/release-process.md
          /docs/github-repository-audit-checklist $repo_docs/github-repository-audit-checklist.md
          EOF
          if [ "$dead" -gt 0 ]; then
            echo "::error::$dead legacy URLs no longer redirect where published links expect."
            exit 1
          fi
          echo "Legacy redirect probe green."

      - name: Probe the installer URLs (cli.ktesio.dev)
        # The install commands point at cli.ktesio.dev/hekma/install.sh|.ps1
        # (served by the ktesio-cli Pages project from scripts/public/; the
        # /hekma/ routes are _redirects rewrites there). Both the current and
        # the legacy root URLs must keep serving.
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://cli.ktesio.dev/hekma/install.sh" \
            "https://cli.ktesio.dev/hekma/install.ps1" \
            "https://cli.ktesio.dev/install.sh" \
            "https://cli.ktesio.dev/install.ps1"; do
            code="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 30 "$url")" || code=000
            if [ "$code" = "200" ]; then
              echo "ok   $url"
            else
              echo "::error::installer URL is DOWN: $url answered HTTP $code (expected 200). The cli.ktesio.dev Pages deploy is stale or the _redirects rewrites are missing."
              exit 1
            fi
          done
